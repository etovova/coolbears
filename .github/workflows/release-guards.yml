name: Validate installed release guards
on:
  push:
    branches: [main]
    paths: ['release-guard.mjs', 'release/**', 'scripts/**', 'config.js', 'mint-live.js', 'mainnet/owner/**', '.github/workflows/release-guards.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate installed code, phase and negative test cases
        run: |
          set -euo pipefail
          mkdir -p build/release-guards
          node --check mainnet/owner/owner.js
          node --check mint-live.js
          node scripts/validate-release-state.mjs
          node scripts/test-release-guard.mjs | tee build/release-guards/guard-tests.log
          node scripts/test-owner-launch.mjs | tee build/release-guards/owner-tests.log
          node scripts/test-mint-policy-config.mjs | tee build/release-guards/policy-tests.log
          node scripts/validate-mint-policy.mjs
          node scripts/audit-prereveal-privacy.mjs
          node scripts/stage-public-site.mjs
          grep -Fq 'await releaseAllows(action)' mainnet/owner/owner.js
          grep -Fq 'await approvedRelease()' mint-live.js
          git rev-parse HEAD > build/release-guards/installed-commit.txt
          cp release/launch-state.json build/release-guards/launch-state.json
      - name: Preserve evidence from the actual committed files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-guard-evidence
          path: build/release-guards/
          retention-days: 30
