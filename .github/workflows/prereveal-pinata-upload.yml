name: Upload CoolBears prereveal metadata to Pinata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate and validate 10,000 padded metadata files
        run: |
          set -euo pipefail
          node scripts/generate-prereveal-metadata.mjs
          test "$(find build/prereveal-metadata -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 10000
          test -f build/prereveal-metadata/0000.json
          test -f build/prereveal-metadata/9999.json

      - name: Upload metadata directory to Pinata V3
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          set -euo pipefail
          test -n "$PINATA_JWT"
          args=(
            -sS -w '%{http_code}'
            -X POST https://uploads.pinata.cloud/v3/files
            -H "Authorization: Bearer $PINATA_JWT"
          )
          for file in build/prereveal-metadata/*.json; do
            base=$(basename "$file")
            args+=( -F "file=@${file};filename=${base};type=application/json" )
          done
          args+=( -F 'network=public' -F 'name=CoolBears Pre-Reveal Metadata 10000' -o pinata-prereveal-upload-result.json )
          http_code=$(curl "${args[@]}")
          cat pinata-prereveal-upload-result.json
          echo
          echo "HTTP $http_code"
          test "$http_code" -ge 200 -a "$http_code" -lt 300
          cid=$(jq -r '.data.cid // .cid // .IpfsHash // empty' pinata-prereveal-upload-result.json)
          test -n "$cid"
          test "$(jq -r '.data.mime_type // empty' pinata-prereveal-upload-result.json)" = "directory"
          test "$(jq -r '.data.number_of_files // 0' pinata-prereveal-upload-result.json)" = "10000"
          echo "CID=$cid" >> "$GITHUB_ENV"
          echo "CoolBears prereveal root CID: $cid"

      - name: Verify representative token metadata under root CID
        run: |
          set -euo pipefail
          for id in 0000 0001 4979 9999; do
            url="https://gateway.pinata.cloud/ipfs/${CID}/${id}.json"
            echo "Checking $url"
            curl --fail --silent --show-error --location --retry 8 --retry-delay 3 "$url" -o "verify-${id}.json"
            node -e "const j=require('./verify-${id}.json'); if(!j.image?.startsWith('ipfs://') || j.attributes?.[0]?.value!=='Unrevealed') process.exit(1)"
          done
          echo "COOLBEARS_PREREVEAL_PINATA_OK CID=${CID}"

      - name: Save upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coolbears-prereveal-pinata-receipt
          path: |
            pinata-prereveal-upload-result.json
            verify-*.json
          retention-days: 30
