name: Upload CoolBears prereveal metadata to Pinata

on:
  # Automatic publication is consolidated in hidden-metadata-release.yml.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate and validate 10,000 padded metadata files
        run: |
          set -euo pipefail
          node scripts/generate-prereveal-metadata.mjs
          test "$(find build/prereveal-metadata -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 10000
          test -f build/prereveal-metadata/0000.json
          test -f build/prereveal-metadata/9999.json

      - name: Pack metadata directory into an IPFS CAR
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts ipfs-car@3.1.0
          npx ipfs-car pack --no-wrap build/prereveal-metadata --output coolbears-prereveal-metadata.car
          test -s coolbears-prereveal-metadata.car
          echo "CAR bytes: $(wc -c < coolbears-prereveal-metadata.car)"

      - name: Upload CAR to Pinata V3
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          set -euo pipefail
          test -n "$PINATA_JWT"
          http_code=$(curl -sS -w '%{http_code}' \
            -X POST https://uploads.pinata.cloud/v3/files \
            -H "Authorization: Bearer $PINATA_JWT" \
            -F "file=@coolbears-prereveal-metadata.car;type=application/vnd.ipld.car" \
            -F "network=public" \
            -F "name=CoolBears Pre-Reveal Metadata 10000" \
            -F "car=true" \
            -o pinata-prereveal-upload-result.json)
          cat pinata-prereveal-upload-result.json
          echo
          echo "HTTP $http_code"
          test "$http_code" -ge 200 -a "$http_code" -lt 300
          cid=$(jq -r '.data.cid // .cid // .IpfsHash // empty' pinata-prereveal-upload-result.json)
          test -n "$cid"
          echo "CID=$cid" >> "$GITHUB_ENV"
          echo "CoolBears prereveal root CID: $cid"

      - name: Verify representative token metadata under root CID
        run: |
          set -euo pipefail
          ok=0
          for prefix in "" "prereveal-metadata/"; do
            echo "Trying CID layout prefix: '${prefix}'"
            pass=1
            for id in 0000 0001 4979 9999; do
              url="https://gateway.pinata.cloud/ipfs/${CID}/${prefix}${id}.json"
              echo "Checking $url"
              if ! curl --fail --silent --show-error --location --retry 8 --retry-delay 3 "$url" -o "verify-${id}.json"; then
                pass=0
                break
              fi
              if ! node --input-type=module -e "import fs from 'node:fs'; import {validateHiddenMetadata} from './scripts/prereveal-policy.mjs'; validateHiddenMetadata(JSON.parse(fs.readFileSync('verify-${id}.json')),Number('${id}'));"; then
                pass=0
                break
              fi
            done
            if [ "$pass" = "1" ]; then
              echo "PATH_PREFIX=${prefix}" >> "$GITHUB_ENV"
              ok=1
              break
            fi
          done
          test "$ok" = "1"
          echo "COOLBEARS_PREREVEAL_PINATA_OK CID=${CID}"

      - name: Save upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coolbears-prereveal-pinata-receipt
          path: |
            pinata-prereveal-upload-result.json
            verify-*.json
          retention-days: 30

