name: Verify final visual mint opened

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-visual-open-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @ton/ton@16.0.0 @ton/core@0.63.1

      - name: Verify final visual mint is open
        env:
          TONCENTER_ENDPOINT: https://testnet.toncenter.com/api/v2/jsonRPC
        run: |
          cat > check.mjs <<'NODE'
          import fs from 'node:fs';
          import {Address} from '@ton/core';
          import {TonClient} from '@ton/ton';
          const p=JSON.parse(fs.readFileSync('testnet/getgems-final-visual/deployment.json','utf8'));
          const c=Address.parse(p.collectionAddressRaw);
          const client=new TonClient({endpoint:process.env.TONCENTER_ENDPOINT});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let last;
          for(let i=1;i<=10;i++){
            try{
              const r=await client.runMethod(c,'get_mint_state');
              const next=r.stack.readBigNumber();
              const supply=r.stack.readBigNumber();
              const price=r.stack.readBigNumber();
              const paused=r.stack.readBigNumber();
              console.log(JSON.stringify({next:Number(next),supply:Number(supply),priceNanoTon:Number(price),paused:paused===1n}));
              if(next!==1n) throw Error('NEXT_NOT_1');
              if(paused!==0n) throw Error('MINT_STILL_PAUSED');
              if(supply!==10000n||price!==7000000000n) throw Error('MINT_STATE_MISMATCH');
              process.exit(0);
            }catch(e){
              last=e;
              if(i===10) throw e;
              await sleep(i*1500);
            }
          }
          throw last;
          NODE
          node check.mjs

      - name: Reconfirm production HOLD
        run: |
          test "$(jq -r '.phase' release/launch-state.json)" = 'hold'
          test "$(jq -r '.mainnetVerified' release/launch-state.json)" = 'false'
          test "$(jq -r '.publicMintApproved' release/launch-state.json)" = 'false'
          test "$(jq -r '.automaticRevealArmed' release/launch-state.json)" = 'false'
          echo PRODUCTION_HOLD_OK
