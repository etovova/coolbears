name: Verify new CoolBears operator
on:
  pull_request:
    paths: ['operator/**', 'metadata/**', 'scripts/hidden-metadata.mjs', '.github/workflows/operator.yml']
  push:
    branches: [main, official-release]
    paths: ['operator/**', 'metadata/**', 'scripts/hidden-metadata.mjs', '.github/workflows/operator.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle-costs:
    name: Isolated lifecycle costs and read-only Devnet calibration
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'lifecycle-costs-')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: operator/package-lock.json
      - run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix operator --ignore-scripts --no-audit --no-fund
      - run: npm run --prefix operator setup
      - run: node operator/costs/cli.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-lifecycle-costs
          path: operator/build/lifecycle-costs/
          retention-days: 14
  isolated-deployment:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'isolated-deployment-')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: operator/package-lock.json
      - run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix operator --ignore-scripts --no-audit --no-fund
      - run: npm run --prefix operator setup
      - run: node operator/deployment/isolated-cli.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-devnet-deployment
          path: operator/build/isolated-deployment/
          retention-days: 14
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: operator/package-lock.json
      - run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix operator --ignore-scripts --no-audit --no-fund
      - run: npm run --prefix operator setup
      - run: npm run --prefix operator verify

  devnet-preview:
    name: Read-only public Devnet cost preview
    needs: verify
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'deployment-preview-') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: operator/package-lock.json
      - run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix operator --ignore-scripts --no-audit --no-fund
      - run: npm run --prefix operator setup
      - name: Read every Devnet message fee and simulate the unsigned first step
        run: node operator/deployment/preview-cli.mjs
      - name: Preserve the public planning report, including blocked results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devnet-cost-preview
          path: build/devnet-cost-preview.json
          retention-days: 14
          if-no-files-found: warn

  gateway-runtime:
    name: Deployment and buyer check gateways in workerd
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            operator/package-lock.json
      - run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix operator --ignore-scripts --no-audit --no-fund
      - run: npm run --prefix operator setup
      - run: node operator/tests/order-submission.runtime.mjs
      - run: node operator/tests/order-replacement.runtime.mjs
      - run: node operator/tests/order-failure-recovery.runtime.mjs
      - run: node operator/tests/order-failed-replacement.runtime.mjs
      - run: node operator/tests/order-response-recovery.runtime.mjs
      - run: node operator/tests/order-prewallet-recovery.runtime.mjs
      - run: node operator/tests/order-prewallet-replacement.runtime.mjs
      - run: node operator/tests/order-prewallet-expiry.runtime.mjs
      - run: node operator/tests/order-gateway.runtime.mjs
      - run: node operator/tests/deployment-gateway.runtime.mjs

  owner-console-browser:
    name: Owner and buyer signing in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            operator/package-lock.json
      - run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix operator --ignore-scripts --no-audit --no-fund
      - run: npm run --prefix operator setup
      - run: node operator/deployment/owner-console/build.mjs
      - name: Install Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/coolbears-owner-browser" --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/coolbears-owner-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "COOLBEARS_PLAYWRIGHT=$RUNNER_TEMP/coolbears-owner-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Buyer single-use submission and finalized recovery
        run: node operator/tests/order-submission.browser.mjs
      - name: Buyer reviewed replacement across browser and gateway restarts
        run: node operator/tests/order-replacement.browser.mjs
      - name: Buyer finalized failure and paid fee recovery
        run: node operator/tests/order-failure-recovery.browser.mjs
      - name: Buyer reviewed replacement after paid failure
        run: node operator/tests/order-failed-replacement.browser.mjs
      - name: Buyer missing response discovery and atomic recovery
        run: node operator/tests/order-response-recovery.browser.mjs
      - name: Buyer prewallet finalized discovery without invented consent
        run: node operator/tests/order-prewallet-recovery.browser.mjs
      - name: Buyer reviewed replacement after a recovered prewallet failure
        run: node operator/tests/order-prewallet-replacement.browser.mjs
      - name: Buyer unsigned expiry retirement without a fabricated signature
        run: node operator/tests/order-prewallet-expiry.browser.mjs
      - name: Buyer HTTPS checker through workerd and SQLite
        run: node operator/tests/order-gateway.browser.mjs
      - name: Buyer sign-only wallet handoff and response recovery
        run: node operator/tests/order-wallet.browser.mjs
      - name: Exact buyer asset signing and durable crash recovery
        run: node operator/tests/order-signing.browser.mjs
      - name: Recover retained native results without signing again
        run: node operator/tests/order-native-recovery.browser.mjs
      - name: Buyer custody in real IndexedDB across browser restarts
        run: node operator/tests/order-storage.browser.mjs
      - run: node operator/tests/deployment-owner-console.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-owner-console-browser
          path: |
            operator/build/owner-console-chromium/
            operator/build/buyer-storage-chromium/
            operator/build/buyer-signing-chromium/
            operator/build/buyer-native-recovery-chromium/
            operator/build/buyer-wallet-chromium/
            operator/build/buyer-gateway-chromium/
            operator/build/buyer-submission-chromium/
            operator/build/buyer-replacement-chromium/
            operator/build/buyer-failure-recovery-chromium/
            operator/build/buyer-failed-replacement-chromium/
            operator/build/buyer-response-recovery-chromium/
            operator/build/buyer-prewallet-recovery-chromium/
            operator/build/buyer-prewallet-replacement-chromium/
            operator/build/buyer-prewallet-expiry-chromium/
          retention-days: 14
