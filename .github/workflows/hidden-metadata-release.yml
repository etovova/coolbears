name: Prepare hidden metadata and unsigned package (no transactions)
on:
  push:
    branches: [main, codex/prereveal-no-attributes]
    paths: ['metadata/**', 'release/prereveal-assets.json', 'scripts/*hidden*', 'scripts/prereveal-policy.mjs', 'scripts/test-prereveal-policy.mjs', 'scripts/rebuild-prereveal-package.mjs', '.github/workflows/hidden-metadata-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coolbears-hidden-metadata
  cancel-in-progress: false
jobs:
  selected-description:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.selection.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: selection
        name: Hold IPFS publication while the selected package needs corrected copy
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const state = JSON.parse(fs.readFileSync('release/launch-state.json'));
          const ready = state.metadataCorrectionPending !== true;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `ready=${ready}\n`);
          if (!ready) console.log('Description correction is prepared separately; active IPFS publication stays held.');
          NODE
  prepare:
    needs: selected-description
    if: needs.selected-description.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned validators
        run: |
          npm install --no-save --ignore-scripts @ton/core@0.63.1 @ton/sandbox@0.44.0 ipfs-car@3.1.0
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Verify unsigned package and all release protections offline
        run: |
          node scripts/validate-release-state.mjs
          node scripts/test-release-guard.mjs
          node scripts/test-owner-launch.mjs
          node scripts/test-mint-policy-config.mjs
          node scripts/test-final-package.mjs
          node scripts/rebuild-prereveal-package.mjs
          cmp launch/candidate.json build/hidden-metadata/candidate.json
      - name: Build only attribute-free public metadata and exact original branding
        run: node scripts/build-hidden-metadata-cars.mjs
      - name: Strictly decode approved logo banner and unchanged animated GIF
        run: python3 scripts/verify-hidden-media.py
      - name: Publish only approved prereveal CARs and verify public readback
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: node scripts/publish-hidden-metadata.mjs
      - name: Preserve public unsigned verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hidden-metadata-unsigned-evidence
          path: |
            build/hidden-metadata/candidate.json
            build/hidden-metadata/cars.json
            build/hidden-metadata/media-proof.json
            build/hidden-metadata/publication-proof.json
            build/final-testnet/report.json
          retention-days: 30
