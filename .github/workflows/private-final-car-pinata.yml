name: Store branded final CoolBears CAR in PRIVATE Pinata
on:
  push:
    branches: [main]
    paths: ['release/private-final-car-upload-request.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coolbears-private-final-branding
  cancel-in-progress: false
jobs:
  migrate-upload-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require exact authorized private-only request and HOLD
        run: |
          node scripts/validate-release-state.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';import crypto from 'node:crypto';
          import {PACKAGE_SHA256} from './launch/package-tools.mjs';
          const r=JSON.parse(fs.readFileSync('release/private-final-car-upload-request.json'));
          const b=fs.readFileSync('launch/candidate.json'),p=JSON.parse(b);
          if(r.authorized!==true||r.action!=='store-exact-final-car-private-pinata')throw Error('NOT_AUTHORIZED');
          if(crypto.createHash('sha256').update(b).digest('hex')!==PACKAGE_SHA256||r.packageSha256!==PACKAGE_SHA256)throw Error('PACKAGE_MISMATCH');
          if(r.carSha256!==p.releaseCarSha256||r.manifestSha256!==p.releaseManifestSha256||p.finalBrandingRevision!=='final-collection-branding-1')throw Error('BINDING_MISMATCH');
          NODE
      - name: Free ephemeral runner disk for one private CAR
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install pinned verifier dependency
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Restore old private CAR, patch branding, upload two parts and verify all 48
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          PINATA_GATEWAY: ${{ vars.PINATA_GATEWAY }}
        run: node scripts/migrate-private-final-branding.mjs
      - name: Confirm production remains held
        run: node scripts/validate-release-state.mjs
      - name: Preserve nonsensitive verification evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branded-private-final-car-pinata-evidence
          path: build/private-final-car/storage-summary.json
          if-no-files-found: ignore
          retention-days: 30
