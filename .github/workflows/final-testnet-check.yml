name: Verify final package and TESTNET request safety
on:
  push:
    branches: [main]
    paths: ['launch/**', 'testnet/final/**', 'scripts/test-final-package.mjs', '.github/workflows/final-testnet-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned offline emulator dependencies
        run: npm install --no-save @ton/core@0.63.1 @ton/sandbox@0.44.0
      - name: Check JavaScript and unchanged mainnet hold
        run: |
          node --check testnet/final/check.js
          node --check launch/package-tools.mjs
          node scripts/validate-release-state.mjs
      - name: Execute exact final StateInit and wallet requests in emulator
        run: |
          set -euo pipefail
          node scripts/test-final-package.mjs
          node scripts/stage-public-site.mjs
          test -f public-site/testnet/final/index.html
          test -f public-site/launch/candidate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-package-testnet-evidence
          path: build/final-testnet/
          retention-days: 30
