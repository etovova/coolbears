name: Verify published valid GIF A/B probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/getgems-gif-ab-public-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'

      - name: Fetch published probe files
        run: |
          set -euo pipefail
          BASE='https://coolbears-nfts.com/testnet/getgems-gif-ab'
          mkdir -p /tmp/gifab
          for path in index.html deployment.json collection.json 0000.json assets/avatar.gif assets/cover.gif assets/nft.gif; do
            safe=$(printf '%s' "$path" | tr '/' '_')
            code=$(curl -fsSL --retry 5 --retry-delay 2 -D "/tmp/gifab/${safe}.headers" -w '%{http_code}' -o "/tmp/gifab/${safe}" "$BASE/$path")
            test "$code" = "200"
            test -s "/tmp/gifab/${safe}"
          done
          cmp --silent testnet/getgems-gif-ab/deployment.json /tmp/gifab/deployment.json
          cmp --silent testnet/getgems-gif-ab/collection.json /tmp/gifab/collection.json
          cmp --silent testnet/getgems-gif-ab/0000.json /tmp/gifab/0000.json
          grep -qi '^content-type: image/gif' /tmp/gifab/assets_avatar.gif.headers
          grep -qi '^content-type: image/gif' /tmp/gifab/assets_cover.gif.headers
          grep -qi '^content-type: image/gif' /tmp/gifab/assets_nft.gif.headers

      - name: Strict-decode all published GIFs
        run: |
          python3 - <<'PY'
          from PIL import Image,ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES=False
          tests=[
            ('/tmp/gifab/assets_avatar.gif',50,100),
            ('/tmp/gifab/assets_cover.gif',20,30),
            ('/tmp/gifab/assets_nft.gif',50,100),
          ]
          for p,expected,limit in tests:
              im=Image.open(p)
              n=getattr(im,'n_frames',1)
              assert n==expected and n<=limit
              for i in range(n): im.seek(i); im.load()
              assert im.info.get('loop')==0
              print(p,n,im.size)
          print('PUBLISHED_GIFS_STRICTLY_VALID=1')
          PY

      - name: Verify exact hashes
        run: |
          test "$(sha256sum /tmp/gifab/assets_avatar.gif | awk '{print $1}')" = "$(jq -r '.sha256.avatar' testnet/getgems-gif-ab/deployment.json)"
          test "$(sha256sum /tmp/gifab/assets_cover.gif | awk '{print $1}')" = "$(jq -r '.sha256.cover' testnet/getgems-gif-ab/deployment.json)"
          test "$(sha256sum /tmp/gifab/assets_nft.gif | awk '{print $1}')" = "$(jq -r '.sha256.nft' testnet/getgems-gif-ab/deployment.json)"
          echo PUBLISHED_GIF_HASHES_OK

      - name: Verify GIF probe address undeployed
        run: |
          set -euo pipefail
          A=$(jq -r '.collectionAddressRaw' testnet/getgems-gif-ab/deployment.json)
          for i in {1..6}; do
            R=$(curl -fsSL --retry 2 "https://testnet.toncenter.com/api/v2/getAddressInformation?address=$A" || true)
            S=$(printf '%s' "$R" | jq -r '.result.state // empty' 2>/dev/null || true)
            if [ "$S" = "uninitialized" ] || [ "$S" = "nonexist" ]; then echo "GIF_PROBE_UNDEPLOYED_OK state=$S"; exit 0; fi
            if [ "$S" = "active" ] || [ "$S" = "frozen" ]; then echo "Unexpected existing state: $S"; exit 1; fi
            sleep $((i*2))
          done
          exit 1

      - name: Reconfirm production HOLD
        run: |
          test "$(jq -r '.phase' release/launch-state.json)" = "hold"
          test "$(jq -r '.mainnetVerified' release/launch-state.json)" = "false"
          test "$(jq -r '.publicMintApproved' release/launch-state.json)" = "false"
          test "$(jq -r '.automaticRevealArmed' release/launch-state.json)" = "false"
          echo PRODUCTION_HOLD_OK
