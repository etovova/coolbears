name: Verify IPFS CAR format with standard libraries
on:
  push:
    branches: [main]
    paths: ['scripts/ipfs-fixture.json', 'scripts/test-ipfs-format.mjs', '.github/workflows/ipfs-format-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install independent format decoders
        run: |
          npm install --no-save @ipld/car @ipld/dag-pb ipfs-unixfs
          mkdir -p build/ipfs-format
          npm ls --json > build/ipfs-format/dependencies.json
      - name: Validate synthetic CAR independently
        run: node scripts/test-ipfs-format.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipfs-format-evidence
          path: build/ipfs-format/
          retention-days: 30
