name: Audit CoolBears prereveal privacy

on:
  push:
    branches: [main]
    paths:
      - 'metadata/prereveal.json'
      - 'contracts/mint-policy.json'
      - 'config.js'
      - 'scripts/generate-prereveal-metadata.mjs'
      - 'scripts/audit-prereveal-privacy.mjs'
      - '.github/workflows/prereveal-privacy-audit.yml'
      - 'scripts/verify-pinned-prereveal.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit active prereveal metadata and production lock
        run: node scripts/audit-prereveal-privacy.mjs
      - name: Generate all 10,000 prereveal metadata files
        run: node scripts/generate-prereveal-metadata.mjs
      - name: Verify generated metadata does not expose final traits
        shell: bash
        run: |
          set -euo pipefail
          test "$(find build/prereveal-metadata -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 10000
          for id in 0000 0001 0042 4979 9999; do
            f="build/prereveal-metadata/${id}.json"
            jq -e '.attributes | length == 2' "$f" >/dev/null
            jq -e '.attributes[] | select(.trait_type=="Status" and .value=="Unrevealed")' "$f" >/dev/null
            jq -e '([.attributes[].trait_type] | sort) == (["Reveal","Status"] | sort)' "$f" >/dev/null
            jq -e '.image == .animation_url' "$f" >/dev/null
          done
          if grep -RniE '"(rarity|rank|background|body|eyes|mouth|hat|clothes|accessory|trait_count)"[[:space:]]*:' build/prereveal-metadata; then
            echo 'Final trait-like data detected in prereveal metadata'
            exit 1
          fi
          echo 'COOLBEARS_PREREVEAL_PRIVACY_10000_OK'

      - name: Verify published IPFS metadata matches audited template
        run: node scripts/verify-pinned-prereveal.mjs
