name: Install promo 02

on:
  push:
    paths:
      - '.asset_upload/READY_PROMO02'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify promo-02
        shell: bash
        run: |
          set -euo pipefail
          cat .asset_upload/promo02.part* | tr -d '\n\r' > /tmp/promo02.b64
          base64 -d /tmp/promo02.b64 > assets/nft/promo-02.webp
          echo 'db45cefa20d4e17ef33932dc4d2274a1558de5d61eb9f3f159c424bbc75bceff  assets/nft/promo-02.webp' | sha256sum -c -
          test "$(wc -c < assets/nft/promo-02.webp)" -eq 43390
          sed -i 's/promo-02.webp?v=3/promo-02.webp?v=4/g' index.html
      - name: Commit verified asset
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/nft/promo-02.webp index.html
          git commit -m 'Install verified promo 02 asset' || exit 0
          git push
