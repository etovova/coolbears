name: CoolBears FunC compile

on:
  push:
    branches: [main]
    paths:
      - 'contracts/src/**'
      - 'scripts/compile-coolbears.mjs'
      - '.github/workflows/contract-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout pinned official TON reference
        run: |
          source contracts/TON_REFERENCE.lock
          git clone --filter=blob:none https://github.com/${source_repository}.git /tmp/token-contract
          git -C /tmp/token-contract checkout --detach "$source_commit"
      - name: Install FunC compiler wrapper
        run: npm install --no-save @ton-community/func-js
      - name: Compile CoolBears contract
        run: node scripts/compile-coolbears.mjs
      - name: Upload compiler outputs
        uses: actions/upload-artifact@v4
        with:
          name: coolbears-func-build
          path: build/contracts/

