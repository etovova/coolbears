name: Test release candidate (no chain transactions)
on:
  push:
    branches: [main]
    paths: ['contracts/candidate/**', '.github/workflows/release-candidate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned TON reference for compiler standard library
        run: |
          set -euo pipefail
          source contracts/TON_REFERENCE.lock
          git clone --filter=blob:none https://github.com/${source_repository}.git /tmp/token-contract
          git -C /tmp/token-contract checkout --detach "$source_commit"
      - name: Install versioned sandbox dependencies
        run: |
          npm install --no-save @ton-community/func-js@0.11.0 @ton/core@0.63.1 @ton/sandbox@0.44.0
          mkdir -p build/candidate
          npm ls --json > build/candidate/dependencies.json
      - name: Save offline reproduction environment (no secrets or git credentials)
        run: |
          cp /tmp/token-contract/stdlib.fc build/candidate/stdlib.fc
          tar -czf build/candidate/offline-environment.tar.gz --exclude='.git' node_modules contracts scripts mainnet config.js mint-live.js index.html
      - name: Concise compile diagnostics
        run: |
          node contracts/candidate/compile.mjs contracts/src/coolbears-collection-mint.fc > build/candidate/legacy.b64
          node contracts/candidate/compile.mjs contracts/candidate/collection.fc > build/candidate/candidate.b64
      - name: Compile, prove source matches legacy package and test candidate
        run: node contracts/candidate/test.mjs
      - name: Upload offline evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-offline-evidence
          path: build/candidate/
          retention-days: 30
