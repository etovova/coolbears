name: Check Getgems rarity fields for TESTNET probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/getgems-rarity-fields-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Query only Getgems rarity fields
        run: |
          set -euo pipefail
          mkdir -p build/getgems-rarity-fields
          cat > /tmp/query.json <<'JSON'
          {
            "query":"query($c:String!,$n0:String!,$n1:String!,$n2:String!,$n3:String!){collection:nftCollectionByAddress(address:$c){address hasRarityAttributes isRarityEnabled isRarityValid} n0:alphaNftItemByAddress(address:$n0){address rarityRank rarityAttributes{traitType value rarityPercent maxShapeCount}} n1:alphaNftItemByAddress(address:$n1){address rarityRank rarityAttributes{traitType value rarityPercent maxShapeCount}} n2:alphaNftItemByAddress(address:$n2){address rarityRank rarityAttributes{traitType value rarityPercent maxShapeCount}} n3:alphaNftItemByAddress(address:$n3){address rarityRank rarityAttributes{traitType value rarityPercent maxShapeCount}}}",
            "variables":{
              "c":"kQCJMZr97lvrX__EqQSO2wuWU9bhuxfPWKKE9hWMPElWQ9ww",
              "n0":"kQCtc4C9OSRvruX0xxI8vG9O5r01J5wXXjd45KrkFv3pC0OX",
              "n1":"kQD7XQNRvE-E5HqRpLOTn4MFPFh1f8zFFwGE06IXeLuUZjGX",
              "n2":"kQBB_MxZlragf6EIwRB47WLTIINbOp40ywnjSbLDk5SfngCK",
              "n3":"kQAOTK5cCx6VtY__3w05jm1pQnMHVrZ3yDZYPZCNh-YCT8VG"
            }
          }
          JSON
          code=$(curl -sS -L --connect-timeout 15 --max-time 45 -w '%{http_code}' -H 'content-type: application/json' -H 'accept: application/json' --data-binary @/tmp/query.json -o build/getgems-rarity-fields/response.json 'https://api.testnet.getgems.io/graphql/' || true)
          echo "$code" > build/getgems-rarity-fields/http-status.txt
          echo "GETGEMS_RARITY_HTTP=$code"
          jq . build/getgems-rarity-fields/response.json || true

      - name: Reconfirm production HOLD
        if: always()
        run: |
          test "$(jq -r '.phase' release/launch-state.json)" = 'hold'
          test "$(jq -r '.mainnetVerified' release/launch-state.json)" = 'false'
          test "$(jq -r '.publicMintApproved' release/launch-state.json)" = 'false'
          echo PRODUCTION_HOLD_OK

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: getgems-rarity-fields-evidence
          path: build/getgems-rarity-fields/
          retention-days: 30
