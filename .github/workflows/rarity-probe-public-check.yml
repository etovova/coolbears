name: Verify published Getgems rarity probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rarity-probe-public-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'

      - name: Verify published rarity metadata and images
        run: |
          set -euo pipefail
          BASE='https://coolbears-nfts.com/testnet/rarity-probe'
          mkdir -p /tmp/rarity
          for path in index.html deployment.json collection.json expected-rarity.json 0000.json 0001.json 0002.json 0003.json assets/0000.png assets/0001.png assets/0002.png assets/0003.png assets/CoolBears_Getgems_Square_Logo_1000x1000.png assets/CoolBears_Getgems_Banner_2880x680.png; do
            safe=$(printf '%s' "$path" | tr '/' '_')
            code=$(curl -fsSL --retry 5 --retry-delay 2 -D "/tmp/rarity/${safe}.headers" -w '%{http_code}' -o "/tmp/rarity/${safe}" "$BASE/$path")
            test "$code" = '200'
            test -s "/tmp/rarity/${safe}"
          done
          cmp --silent testnet/rarity-probe/deployment.json /tmp/rarity/deployment.json
          cmp --silent testnet/rarity-probe/collection.json /tmp/rarity/collection.json
          cmp --silent testnet/rarity-probe/expected-rarity.json /tmp/rarity/expected-rarity.json
          test "$(sha256sum /tmp/rarity/assets_CoolBears_Getgems_Square_Logo_1000x1000.png | awk '{print $1}')" = "5d8398d9497deab99a1c57d147df43047131fa9354097ea2879385f3bf6d71e7"
          test "$(sha256sum /tmp/rarity/assets_CoolBears_Getgems_Banner_2880x680.png | awk '{print $1}')" = "d3f82a120907b3ec5747628127580b9a1f80757676692361f43a533b5248bb95"
          grep -qi '^content-type: image/png' /tmp/rarity/assets_CoolBears_Getgems_Square_Logo_1000x1000.png.headers
          grep -qi '^content-type: image/png' /tmp/rarity/assets_CoolBears_Getgems_Banner_2880x680.png.headers
          test "$(jq -r '.image' /tmp/rarity/collection.json)" = "https://coolbears-nfts.com/testnet/rarity-probe/assets/CoolBears_Getgems_Square_Logo_1000x1000.png"
          test "$(jq -r '.cover_image' /tmp/rarity/collection.json)" = "https://coolbears-nfts.com/testnet/rarity-probe/assets/CoolBears_Getgems_Banner_2880x680.png"
          test "$(jq -r '.description|length' /tmp/rarity/collection.json)" -gt 200
          for i in 0000 0001 0002 0003; do
            cmp --silent "testnet/rarity-probe/$i.json" "/tmp/rarity/$i.json"
            grep -qi '^content-type: image/png' "/tmp/rarity/assets_${i}.png.headers"
          done
          grep -qi '^content-type: application/json' /tmp/rarity/collection.json.headers
          echo PUBLISHED_RARITY_BYTES_OK

      - name: Recompute controlled percentages from published metadata
        run: |
          python3 - <<'PY'
          import json,collections
          metas=[json.load(open(f'/tmp/rarity/{i:04d}.json')) for i in range(4)]
          cats=['Background','Body','Clothes','Mouth','Eyes','Head','Ears']
          rows=[]
          for c in cats:
              vals=[]
              for m in metas:
                  d={a['trait_type']:a['value'] for a in m['attributes']}
                  vals.append(d[c])
              cnt=collections.Counter(vals)
              rows.append((c,{k:v/4*100 for k,v in cnt.items()}))
          pcts=sorted({p for _,d in rows for p in d.values()})
          assert pcts==[25.0,50.0,75.0],pcts
          exp=json.load(open('/tmp/rarity/expected-rarity.json'))
          assert exp['expectedRarityOrder']==['0000','0001','0002','0003']
          assert exp['expectedPercentages']==[25.0,50.0,75.0]
          print('RARITY_PERCENTAGES_RECOMPUTED_OK',rows)
          PY

      - name: Verify published image dimensions
        run: |
          python3 - <<'PY'
          from PIL import Image
          for i in range(4):
              p=f'/tmp/rarity/assets_{i:04d}.png'
              im=Image.open(p); im.load()
              assert im.format=='PNG' and im.size==(1000,1000)
          logo=Image.open('/tmp/rarity/assets_CoolBears_Getgems_Square_Logo_1000x1000.png'); logo.load()
          banner=Image.open('/tmp/rarity/assets_CoolBears_Getgems_Banner_2880x680.png'); banner.load()
          assert logo.format=='PNG' and logo.size==(1000,1000)
          assert banner.format=='PNG' and banner.size==(2048,483)
          print('RARITY_IMAGES_AND_EXACT_BRANDING_OK')
          PY

      - name: Verify rarity probe remains undeployed
        run: |
          set -euo pipefail
          A=$(jq -r '.collectionAddressRaw' testnet/rarity-probe/deployment.json)
          for i in {1..6}; do
            R=$(curl -fsSL --retry 2 "https://testnet.toncenter.com/api/v2/getAddressInformation?address=$A" || true)
            S=$(printf '%s' "$R" | jq -r '.result.state // empty' 2>/dev/null || true)
            if [ "$S" = 'uninitialized' ] || [ "$S" = 'nonexist' ]; then echo "RARITY_PROBE_UNDEPLOYED_OK state=$S"; exit 0; fi
            if [ "$S" = 'active' ] || [ "$S" = 'frozen' ]; then echo "Unexpected existing state: $S"; exit 1; fi
            sleep $((i*2))
          done
          exit 1

      - name: Reconfirm production HOLD
        run: |
          test "$(jq -r '.phase' release/launch-state.json)" = 'hold'
          test "$(jq -r '.mainnetVerified' release/launch-state.json)" = 'false'
          test "$(jq -r '.publicMintApproved' release/launch-state.json)" = 'false'
          test "$(jq -r '.automaticRevealArmed' release/launch-state.json)" = 'false'
          echo PRODUCTION_HOLD_OK
