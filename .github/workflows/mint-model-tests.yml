name: CoolBears mint model tests

on:
  push:
    branches: [main]
    paths:
      - 'contracts/mint-policy.json'
      - 'contracts/tests/**'
      - '.github/workflows/mint-model-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test mint invariants
        run: node contracts/tests/mint-policy.test.mjs
