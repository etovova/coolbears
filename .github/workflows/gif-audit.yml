name: Audit corrected TESTNET prereveal media

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gif-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact corrected candidate
        run: |
          set -euo pipefail
          test "$(sha256sum launch/candidate.json | awk '{print $1}')" = "241bd1d8331f91361504474d87e745104eee75b99423cca472628d993bc1760f"
          test "$(jq -r '.collectionRevision' launch/candidate.json)" = "v3-glasses-correction-1"
      - run: pip install pillow
      - name: Fetch live prereveal metadata for #0000 and #0001
        run: |
          set -euo pipefail
          ROOT=$(jq -r '.preRevealMetadataRootIpfs' launch/candidate.json)
          case "$ROOT" in
            ipfs://*) CIDPATH=${ROOT#ipfs://} ;;
            *) echo "unexpected prereveal root"; exit 1 ;;
          esac
          BASE="https://gateway.pinata.cloud/ipfs/${CIDPATH}"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "${BASE}0000.json" -o /tmp/0000.json
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "${BASE}0001.json" -o /tmp/0001.json
          jq -e 'type=="object" and (.name|type=="string") and (.image|type=="string")' /tmp/0000.json >/dev/null
          jq -e 'type=="object" and (.name|type=="string") and (.image|type=="string")' /tmp/0001.json >/dev/null
          IMG0=$(jq -r '.image' /tmp/0000.json)
          IMG1=$(jq -r '.image' /tmp/0001.json)
          test "$IMG0" = "$IMG1"
          printf '%s' "$IMG0" > /tmp/image-uri.txt
          echo PREREVEAL_METADATA_0000_0001_OK
      - name: Fetch and inspect public prereveal GIF
        run: |
          set -euo pipefail
          IMG=$(cat /tmp/image-uri.txt)
          case "$IMG" in
            ipfs://*) URL="https://gateway.pinata.cloud/ipfs/${IMG#ipfs://}" ;;
            https://*) URL="$IMG" ;;
            *) echo "unsupported image URI"; exit 1 ;;
          esac
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$URL" -o /tmp/prereveal.gif
          python - <<'PY'
          from PIL import Image
          import os, hashlib
          p='/tmp/prereveal.gif'
          im=Image.open(p)
          frames=getattr(im,'n_frames',1)
          durations=[]
          for i in range(frames):
              im.seek(i)
              durations.append(im.info.get('duration',0))
          assert frames > 1, 'GIF is not animated'
          assert im.info.get('loop') == 0, 'GIF is not infinite loop'
          assert os.path.getsize(p) > 0, 'empty GIF'
          print('PREREVEAL_MEDIA_OK')
          print('GIF_SIZE', im.size)
          print('GIF_FRAMES', frames)
          print('GIF_DURATION_MS', sum(durations))
          print('GIF_SHA256', hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
