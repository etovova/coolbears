name: CoolBears mint policy check

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'config.js'
      - 'mainnet/owner/deployment.json'
      - 'scripts/validate-mint-policy.mjs'
      - 'scripts/test-mint-policy-config.mjs'
      - '.github/workflows/mint-policy-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate launch parameters against actual deployment package
        run: node scripts/validate-mint-policy.mjs
      - name: Reject wrong destinations and unauthorized mode changes
        run: node scripts/test-mint-policy-config.mjs
