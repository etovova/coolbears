name: CoolBears mint policy check

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'config.js'
      - 'scripts/validate-mint-policy.mjs'
      - '.github/workflows/mint-policy-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate immutable launch parameters and deployment gate
        run: node scripts/validate-mint-policy.mjs
