name: Rebuild public assets

on:
  push:
    branches: [asset-upload]
    paths:
      - '.asset_upload/complete.flag'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: asset-upload
      - name: Rebuild prereveal GIF and promo image
        run: |
          mkdir -p assets/nft
          cat .asset_upload/prereveal_* > /tmp/prereveal.b64
          cat .asset_upload/promo01_* > /tmp/promo01.b64
          base64 -d /tmp/prereveal.b64 > assets/coolbears-prereveal.gif
          base64 -d /tmp/promo01.b64 > assets/nft/promo-01.webp
          file assets/coolbears-prereveal.gif assets/nft/promo-01.webp
      - name: Commit public assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/coolbears-prereveal.gif assets/nft/promo-01.webp
          git rm -r .asset_upload
          git commit -m "Add optimized public CoolBears assets"
          git push origin asset-upload
