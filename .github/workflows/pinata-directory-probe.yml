name: Probe Pinata V3 directory upload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pinata-directory-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-directory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build tiny directory probe
        run: |
          mkdir -p build/pinata-probe
          printf '{"probe":"a"}\n' > build/pinata-probe/a.json
          printf '{"probe":"b"}\n' > build/pinata-probe/b.json

      - name: Try Pinata V3 multi-file directory upload
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          set -euo pipefail
          test -n "$PINATA_JWT"

          http_code=$(curl -sS -w '%{http_code}' \
            -X POST https://uploads.pinata.cloud/v3/files \
            -H "Authorization: Bearer $PINATA_JWT" \
            -F "file=@build/pinata-probe/a.json;filename=pinata-probe/a.json;type=application/json" \
            -F "file=@build/pinata-probe/b.json;filename=pinata-probe/b.json;type=application/json" \
            -F "network=public" \
            -F "name=CoolBears Directory Probe" \
            -o pinata-directory-probe-result.json)

          cat pinata-directory-probe-result.json
          echo
          echo "HTTP $http_code"
          test "$http_code" -ge 200 -a "$http_code" -lt 300

          cid=$(jq -r '.data.cid // .cid // .IpfsHash // empty' pinata-directory-probe-result.json)
          test -n "$cid"
          test "$(jq -r '.data.mime_type // empty' pinata-directory-probe-result.json)" = "directory"
          test "$(jq -r '.data.number_of_files // 0' pinata-directory-probe-result.json)" = "2"
          echo "CID=$cid" >> "$GITHUB_ENV"
          echo "Root CID: $cid"

      - name: Discover and verify preserved directory paths
        run: |
          set -euo pipefail
          ok=0
          for prefix in "" "pinata-probe/"; do
            echo "Trying root layout prefix: '${prefix}'"
            if curl --fail --silent --show-error --location --retry 5 --retry-delay 2 \
                "https://gateway.pinata.cloud/ipfs/${CID}/${prefix}a.json" -o a.json \
              && curl --fail --silent --show-error --location --retry 5 --retry-delay 2 \
                "https://gateway.pinata.cloud/ipfs/${CID}/${prefix}b.json" -o b.json; then
              if grep -q '"probe":"a"' a.json && grep -q '"probe":"b"' b.json; then
                echo "PATH_PREFIX=${prefix}" >> "$GITHUB_ENV"
                ok=1
                break
              fi
            fi
          done
          test "$ok" = "1"
          echo "PINATA_DIRECTORY_PROBE_OK CID=${CID}"

      - name: Save probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coolbears-pinata-directory-probe
          path: |
            pinata-directory-probe-result.json
            a.json
            b.json
          retention-days: 7
