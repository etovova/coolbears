name: Diagnose corrected TESTNET metadata rendering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/testnet-metadata-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bind exact corrected candidate
        run: |
          set -euo pipefail
          test "$(sha256sum launch/candidate.json | awk '{print $1}')" = "241bd1d8331f91361504474d87e745104eee75b99423cca472628d993bc1760f"
          test "$(jq -r '.collectionRevision' launch/candidate.json)" = "v3-glasses-correction-1"

      - name: Fetch collection metadata actually referenced by corrected contract
        run: |
          set -euo pipefail
          URI=$(jq -r '.collectionMetadataIpfs' launch/candidate.json)
          case "$URI" in
            ipfs://*) URL="https://gateway.pinata.cloud/ipfs/${URI#ipfs://}" ;;
            *) echo "Unexpected collection metadata URI"; exit 1 ;;
          esac
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$URL" -o /tmp/collection.json
          jq -e '.name=="CoolBears" and (.description|type=="string" and length>20) and (.image|type=="string") and (.external_url|type=="string")' /tmp/collection.json >/dev/null
          jq '{name,description,image,cover_image,external_url,social_links}' /tmp/collection.json
          echo COLLECTION_DESCRIPTION_LIVE_OK

      - name: Install TON client
        run: npm install --no-save @ton/ton@16.0.0 @ton/core@0.63.1

      - name: Resolve live corrected TESTNET NFT 0000 metadata URI from chain
        env:
          TONCENTER_ENDPOINT: https://testnet.toncenter.com/api/v2/jsonRPC
        run: |
          cat > resolve-testnet-metadata.mjs <<'NODE'
          import fs from 'node:fs';
          import {Address} from '@ton/core';
          import {TonClient} from '@ton/ton';
          const p=JSON.parse(fs.readFileSync('launch/candidate.json','utf8'));
          const client=new TonClient({endpoint:process.env.TONCENTER_ENDPOINT});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function run(a,m,stack=[]){
            for(let i=1;i<=8;i++){
              try{const r=await client.runMethod(a,m,stack);await sleep(1500);return r;}
              catch(e){if(e?.response?.status!==429||i===8)throw e;await sleep(i*2500);}
            }
          }
          const collection=Address.parse(p.collectionAddressRaw);
          const ar=await run(collection,'get_nft_address_by_index',[{type:'int',value:0n}]);
          const nftAddr=ar.stack.readAddress();
          const nr=await run(nftAddr,'get_nft_data');
          if(nr.stack.readBigNumber()!==-1n)throw Error('NFT0_NOT_INITIALIZED');
          const index=nr.stack.readBigNumber();
          nr.stack.readAddress();nr.stack.readAddress();
          const individual=nr.stack.readCell();
          const cr=await run(collection,'get_nft_content',[{type:'int',value:index},{type:'cell',cell:individual}]);
          const s=cr.stack.readCell().beginParse();
          if(s.loadUint(8)!==1)throw Error('BAD_OFFCHAIN_TAG');
          const uri=s.loadStringTail();
          if(uri!==p.preRevealMetadataRootIpfs+'0000.json')throw Error('NFT0_URI_MISMATCH');
          fs.writeFileSync('/tmp/nft0-uri.txt',uri);
          console.log('NFT0_CHAIN_METADATA_URI_OK');
          NODE
          node resolve-testnet-metadata.mjs

      - name: Fetch live NFT 0000 metadata and verify description plus animation_url
        run: |
          set -euo pipefail
          URI=$(cat /tmp/nft0-uri.txt)
          URL="https://gateway.pinata.cloud/ipfs/${URI#ipfs://}"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$URL" -o /tmp/nft0.json
          jq -e '(.description|type=="string" and length>20) and (.image|type=="string") and (.animation_url|type=="string") and (.image==.animation_url)' /tmp/nft0.json >/dev/null
          jq '{name,description,image,animation_url,external_url,attributes}' /tmp/nft0.json
          echo NFT0_DESCRIPTION_AND_ANIMATION_URL_LIVE_OK

      - name: Fetch and inspect exact public GIF
        run: |
          set -euo pipefail
          URI=$(jq -r '.animation_url' /tmp/nft0.json)
          URL="https://gateway.pinata.cloud/ipfs/${URI#ipfs://}"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$URL" -o /tmp/prereveal.gif
          python3 - <<'PY'
          from PIL import Image
          import hashlib, os
          p='/tmp/prereveal.gif'
          im=Image.open(p)
          frames=getattr(im,'n_frames',1)
          durations=[]
          for i in range(frames):
              im.seek(i)
              durations.append(im.info.get('duration',0))
          assert frames>1
          assert im.info.get('loop')==0
          print('GIF_ANIMATED_LIVE_OK')
          print('frames=',frames)
          print('duration_ms=',sum(durations))
          print('bytes=',os.path.getsize(p))
          print('sha256=',hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY
