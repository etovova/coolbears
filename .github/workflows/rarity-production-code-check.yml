name: Verify production-code rarity TESTNET setup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rarity-production-code-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify verified CoolBears code binding and public rarity page
        run: |
          set -euo pipefail
          PROD_HASH='4a5dcc56c96ab4bfb1815242b3e696ee1a1663c9f1254c893455d47bb746dc2b'
          test "$(jq -r '.collectionCodeHash' testnet/getgems-finalmedia-ab/deployment.json)" = "$PROD_HASH"
          test "$(jq -r '.sourceCandidateCodeHash' testnet/getgems-finalmedia-ab/deployment.json)" = "$PROD_HASH"
          test "$(jq -r '.network' testnet/getgems-finalmedia-ab/deployment.json)" = 'testnet'
          grep -Fq "../getgems-finalmedia-ab/deployment.json" testnet/rarity-probe/probe.js
          grep -Fq "21300000000" testnet/rarity-probe/probe.js
          grep -Fq "7100000000" testnet/rarity-probe/probe.js
          echo VERIFIED_COOLBEARS_CODE_BINDING_OK

      - name: Verify exact collection branding and approved description
        run: |
          set -euo pipefail
          C=testnet/getgems-finalmedia-ab/collection.json
          test "$(jq -r '.name' "$C")" = 'CoolBears'
          test "$(jq -r '.image' "$C")" = 'https://coolbears-nfts.com/testnet/rarity-probe/assets/CoolBears_Getgems_Square_Logo_1000x1000.png'
          test "$(jq -r '.cover_image' "$C")" = 'https://coolbears-nfts.com/testnet/rarity-probe/assets/CoolBears_Getgems_Banner_2880x680.png'
          python3 - <<'PY'
          import json
          c=json.load(open('testnet/getgems-finalmedia-ab/collection.json'))
          expected='10,000 unique CoolBears on TON. Everyone gets a bear. Not everyone gets a legend.\n\nNo real value. No financial returns. No celebrity backing. Don’t buy expecting profit. CoolBears is just for fun.\n\nMint will be available at https://coolbears-nfts.com'
          assert c['description']==expected,(c['description'],expected)
          PY
          echo EXACT_COLLECTION_METADATA_OK

      - name: Verify four controlled rarity metadata files
        run: |
          python3 - <<'PY'
          import json,collections
          cats=['Background','Body','Clothes','Mouth','Eyes','Head','Ears']
          metas=[]
          for i in range(4):
              p=f'testnet/getgems-finalmedia-ab/{i:04d}.json'
              m=json.load(open(p))
              assert len(m['attributes'])==7
              d={a['trait_type']:a['value'] for a in m['attributes']}
              assert set(d)==set(cats)
              metas.append(d)
          rows={}
          for c in cats:
              cnt=collections.Counter(m[c] for m in metas)
              rows[c]={k:v/4*100 for k,v in cnt.items()}
          pcts=sorted({p for d in rows.values() for p in d.values()})
          assert pcts==[25.0,50.0,75.0],pcts
          def score(m):
              s=0
              for c in cats:
                  n=sum(1 for x in metas if x[c]==m[c])
                  s+=1/(n/4)
              return s
          scores=[score(m) for m in metas]
          order=sorted(range(4),key=lambda i:scores[i],reverse=True)
          assert order==[0,1,2,3],(scores,order)
          print('CONTROLLED_RARITY_OK',rows,scores,order)
          PY

      - name: Verify published website bytes
        run: |
          set -euo pipefail
          BASE='https://coolbears-nfts.com'
          mkdir -p /tmp/rp
          for path in testnet/rarity-probe/index.html testnet/rarity-probe/probe.js testnet/getgems-finalmedia-ab/collection.json testnet/getgems-finalmedia-ab/0000.json testnet/getgems-finalmedia-ab/0001.json testnet/getgems-finalmedia-ab/0002.json testnet/getgems-finalmedia-ab/0003.json; do
            safe=$(printf '%s' "$path" | tr '/' '_')
            curl -fsSL --retry 5 --retry-delay 2 "$BASE/$path" -o "/tmp/rp/$safe"
            test -s "/tmp/rp/$safe"
          done
          cmp --silent testnet/rarity-probe/probe.js /tmp/rp/testnet_rarity-probe_probe.js
          cmp --silent testnet/getgems-finalmedia-ab/collection.json /tmp/rp/testnet_getgems-finalmedia-ab_collection.json
          for i in 0000 0001 0002 0003; do
            cmp --silent "testnet/getgems-finalmedia-ab/$i.json" "/tmp/rp/testnet_getgems-finalmedia-ab_${i}.json"
          done
          echo PUBLISHED_RARITY_SETUP_BYTES_OK

      - name: Check TonAPI sees existing verified contract and NFT 0000
        run: |
          set -euo pipefail
          COLL=$(jq -r '.collectionAddressTestnetBounceable' testnet/getgems-finalmedia-ab/deployment.json)
          code=$(curl -sS -L --connect-timeout 15 --max-time 45 -w '%{http_code}' -o /tmp/coll.json "https://testnet.tonapi.io/v2/nfts/collections/$COLL" || true)
          test "$code" = '200'
          next=$(jq -r '.next_item_index // empty' /tmp/coll.json)
          test "$next" -ge 1
          echo "TONAPI_COLLECTION_ACTIVE next=$next"
          jq '{address,next_item_index,metadata}' /tmp/coll.json

      - name: Reconfirm production HOLD
        run: |
          test "$(jq -r '.phase' release/launch-state.json)" = 'hold'
          test "$(jq -r '.mainnetVerified' release/launch-state.json)" = 'false'
          test "$(jq -r '.publicMintApproved' release/launch-state.json)" = 'false'
          test "$(jq -r '.automaticRevealArmed' release/launch-state.json)" = 'false'
          echo PRODUCTION_HOLD_OK
