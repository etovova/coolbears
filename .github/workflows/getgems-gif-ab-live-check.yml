name: Verify valid GIF Getgems probe NFT 0000 on TESTNET

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/getgems-gif-ab-live-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TON readers and GIF validator
        run: |
          npm install --no-save @ton/ton@16.0.0 @ton/core@0.63.1
          python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'

      - name: Verify live GIF probe and NFT 0000
        env:
          TONCENTER_ENDPOINT: https://testnet.toncenter.com/api/v2/jsonRPC
        run: |
          mkdir -p build/getgems-gif-live
          cat > verify-gif-probe.mjs <<'NODE'
          import fs from 'node:fs';
          import {Address,Cell} from '@ton/core';
          import {TonClient} from '@ton/ton';

          const p=JSON.parse(fs.readFileSync('testnet/getgems-gif-ab/deployment.json','utf8'));
          if(!p.diagnosticOnly||p.variant!=='valid-gif-https'||p.network!=='testnet') throw Error('BAD_GIF_PROBE_PACKAGE');

          const client=new TonClient({endpoint:process.env.TONCENTER_ENDPOINT});
          const collection=Address.parse(p.collectionAddressRaw);
          const st=await client.getContractState(collection);
          if(st.state!=='active'||!st.code||!st.data) throw Error('GIF_PROBE_NOT_ACTIVE_'+st.state);
          const codeHash=Cell.fromBoc(st.code)[0].hash().toString('hex');
          if(codeHash!==p.collectionCodeHash) throw Error('GIF_PROBE_CODE_HASH_MISMATCH');

          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function run(a,m,stack=[]){
            let last;
            for(let i=1;i<=8;i++){
              try { const r=await client.runMethod(a,m,stack); await sleep(1200); return r; }
              catch(e){ last=e; if(e?.response?.status!==429||i===8) throw e; await sleep(i*2000); }
            }
            throw last;
          }

          const cd=(await run(collection,'get_collection_data')).stack;
          const next=cd.readBigNumber();
          const content=cd.readCell();
          const owner=cd.readAddress();
          if(next!==1n) throw Error('EXPECTED_NEXT_1_GOT_'+next);
          if(owner.toRawString()!==p.ownerAddressRaw) throw Error('OWNER_MISMATCH');
          const cs=content.beginParse();
          if(cs.loadUint(8)!==1) throw Error('COLLECTION_CONTENT_TAG_MISMATCH');
          const uri=cs.loadStringTail();
          if(uri!==p.collectionMetadataUrl) throw Error('COLLECTION_URI_MISMATCH');

          const mint=(await run(collection,'get_mint_state')).stack;
          const mintNext=mint.readBigNumber();
          const supply=mint.readBigNumber();
          const price=mint.readBigNumber();
          const paused=mint.readBigNumber();
          if(mintNext!==1n||supply!==10000n||price!==7000000000n||paused!==1n) throw Error('MINT_STATE_MISMATCH');

          const ar=(await run(collection,'get_nft_address_by_index',[{type:'int',value:0n}])).stack;
          const nft=ar.readAddress();
          const ns=await client.getContractState(nft);
          if(ns.state!=='active'||!ns.code) throw Error('GIF_NFT0_NOT_ACTIVE');
          const nftCodeHash=Cell.fromBoc(ns.code)[0].hash().toString('hex');
          if(nftCodeHash!==p.nftItemCodeHash) throw Error('GIF_NFT0_CODE_HASH_MISMATCH');

          const nd=(await run(nft,'get_nft_data')).stack;
          const initialized=nd.readBigNumber();
          const index=nd.readBigNumber();
          const coll=nd.readAddress();
          const nftOwner=nd.readAddress();
          const individual=nd.readCell();
          if(initialized!==-1n||index!==0n||coll.toRawString()!==collection.toRawString()||nftOwner.toRawString()!==p.ownerAddressRaw) throw Error('GIF_NFT0_DATA_MISMATCH');

          const suffix=individual.beginParse().loadStringTail();
          if(suffix!=='0000.json') throw Error('GIF_NFT0_SUFFIX_MISMATCH');

          const full=(await run(collection,'get_nft_content',[{type:'int',value:0n},{type:'cell',cell:individual}])).stack.readCell().beginParse();
          if(full.loadUint(8)!==1) throw Error('GIF_NFT0_CONTENT_TAG_MISMATCH');
          const nftUri=full.loadStringTail();
          const expected=p.commonMetadataPrefix+'0000.json';
          if(nftUri!==expected) throw Error('GIF_NFT0_URI_MISMATCH');

          const bounce=nft.toString({testOnly:true,bounceable:true});
          fs.writeFileSync('build/getgems-gif-live/nft0.txt',bounce+'\n');
          fs.writeFileSync('build/getgems-gif-live/live.json',JSON.stringify({
            status:'VALID_GIF_PROBE_NFT0_VERIFIED',
            collection:p.collectionAddressTestnetBounceable,
            nft0:bounce,
            nextItemIndex:Number(next),
            paused:true,
            ownerVerified:true,
            nftMetadataUri:nftUri,
            nftCodeHash
          },null,2)+'\n');
          console.log(fs.readFileSync('build/getgems-gif-live/live.json','utf8'));
          NODE
          node verify-gif-probe.mjs

      - name: Poll TonAPI TESTNET for GIF probe NFT metadata
        run: |
          set -euo pipefail
          NFT=$(cat build/getgems-gif-live/nft0.txt)
          for i in {1..12}; do
            code=$(curl -sS -L --connect-timeout 15 --max-time 45 -w '%{http_code}' -o build/getgems-gif-live/tonapi-nft0.json "https://testnet.tonapi.io/v2/nfts/$NFT" || true)
            echo "attempt=$i http=$code"
            if [ "$code" = "200" ]; then
              name=$(jq -r '.metadata.name // empty' build/getgems-gif-live/tonapi-nft0.json)
              desc=$(jq -r '.metadata.description // empty' build/getgems-gif-live/tonapi-nft0.json)
              img=$(jq -r '.metadata.image // empty' build/getgems-gif-live/tonapi-nft0.json)
              echo "name=$name"
              if [ "$name" = "CoolBears GIF Probe #0000" ] && [ -n "$desc" ] && [ -n "$img" ]; then
                echo "TONAPI_GIF_PROBE_NFT_METADATA_COMPLETE=1"
                break
              fi
            fi
            sleep 20
          done
          test "$(jq -r '.metadata.name // empty' build/getgems-gif-live/tonapi-nft0.json)" = "CoolBears GIF Probe #0000"
          test -n "$(jq -r '.metadata.description // empty' build/getgems-gif-live/tonapi-nft0.json)"
          test -n "$(jq -r '.metadata.image // empty' build/getgems-gif-live/tonapi-nft0.json)"
          jq '{address,index,owner,collection,metadata,previews}' build/getgems-gif-live/tonapi-nft0.json > build/getgems-gif-live/tonapi-summary.json

      - name: Strict-check GIF actually referenced by TonAPI metadata
        run: |
          set -euo pipefail
          URL=$(jq -r '.metadata.image' build/getgems-gif-live/tonapi-nft0.json)
          curl -fsSL --retry 5 --retry-delay 2 -D build/getgems-gif-live/gif.headers -o build/getgems-gif-live/gif.bin "$URL"
          grep -qi '^content-type: image/gif' build/getgems-gif-live/gif.headers
          python3 - <<'PY'
          from PIL import Image,ImageFile
          import hashlib,json,os
          ImageFile.LOAD_TRUNCATED_IMAGES=False
          p='build/getgems-gif-live/gif.bin'
          im=Image.open(p)
          n=getattr(im,'n_frames',1)
          assert n==50
          durations=[]
          for i in range(n):
              im.seek(i); durations.append(im.info.get('duration',0)); im.load()
          assert im.info.get('loop')==0
          out={'strictValid':True,'frames':n,'size':list(im.size),'durationMs':sum(durations),'bytes':os.path.getsize(p),'sha256':hashlib.sha256(open(p,'rb').read()).hexdigest()}
          open('build/getgems-gif-live/gif-report.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out))
          PY
          test "$(jq -r '.sha256' build/getgems-gif-live/gif-report.json)" = "$(jq -r '.sha256.nft' testnet/getgems-gif-ab/deployment.json)"
          echo TONAPI_REFERENCED_GIF_STRICT_VALID=1

      - name: Reconfirm production HOLD
        run: |
          test "$(jq -r '.phase' release/launch-state.json)" = "hold"
          test "$(jq -r '.mainnetVerified' release/launch-state.json)" = "false"
          test "$(jq -r '.publicMintApproved' release/launch-state.json)" = "false"
          test "$(jq -r '.automaticRevealArmed' release/launch-state.json)" = "false"
          echo PRODUCTION_HOLD_OK

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: getgems-valid-gif-live-evidence
          path: build/getgems-gif-live/
          retention-days: 30
