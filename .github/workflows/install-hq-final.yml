name: Finalize CoolBears website artwork

on:
  push:
    paths:
      - '.asset_upload/cleanup-hq/READY'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary image overrides
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          for href in [
            'assets/nft/hq-hero.css?v=2',
            'assets/nft/hq-gallery-1.css?v=1',
            'assets/nft/hq-gallery-2.css?v=1',
            'assets/nft/hq-gallery-3.css?v=1',
            'assets/nft/hq-gallery-4.css?v=1',
            'assets/nft/hq-gallery-5.css?v=1',
            'assets/nft/hq-gallery-6.css?v=1',
          ]:
              s=s.replace(f'<link rel="stylesheet" href="{href}">','')
          p.write_text(s)
          PY
          rm -f assets/nft/hq-hero.css
          rm -f assets/nft/hq-gallery-1.css assets/nft/hq-gallery-2.css assets/nft/hq-gallery-3.css assets/nft/hq-gallery-4.css assets/nft/hq-gallery-5.css assets/nft/hq-gallery-6.css
          rm -f assets/nft/hero-main-hq.webp.b64.txt
          rm -rf .asset_upload/cleanup-hq
          rm -f .github/workflows/install-hq-final.yml
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary HQ image overrides' || exit 0
          git push
