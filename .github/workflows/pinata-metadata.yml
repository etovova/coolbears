name: Upload prereveal metadata to Pinata

on:
  # Automatic publication is consolidated in hidden-metadata-release.yml.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload prereveal metadata to Pinata V3
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          test -n "$PINATA_JWT"
          test -f metadata/prereveal.json
          http_code=$(curl -sS -w '%{http_code}' \
            -X POST https://uploads.pinata.cloud/v3/files \
            -H "Authorization: Bearer $PINATA_JWT" \
            -F "file=@metadata/prereveal.json;type=application/json" \
            -F "network=public" \
            -F "name=CoolBears Pre-Reveal Metadata" \
            -o pinata-metadata-result.json)
          cat pinata-metadata-result.json
          test "$http_code" -ge 200 -a "$http_code" -lt 300
      - name: Save metadata CID response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coolbears-pinata-metadata-cid
          path: pinata-metadata-result.json
          retention-days: 30
