name: Compare original CoolBears and Getgems A/B probe in TonAPI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compare-original-probe-tonapi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Query TonAPI TESTNET for original and probe
        run: |
          set -euo pipefail
          mkdir -p build/tonapi-compare
          OC=$(jq -r '.collectionAddressTestnetBounceable' launch/candidate.json)
          ON0='kQB1Rf_DJDopEY_R4TaqXIWBFneqmEFQhl9lI8YSk3eAa3g_'
          ON1='kQB_cDSCL8uSekg2zv1w9utxshmx4BAAGGr4xJf6Vsm1p7Gw'
          PC=$(jq -r '.collectionAddressTestnetBounceable' testnet/getgems-ab/deployment.json)
          PN0='kQDrhTQDljP2dDqSqzYtL_CNIv7lW_pRfS6bQ-pIOCk804c_'
          for spec in \
            "original_collection|https://testnet.tonapi.io/v2/nfts/collections/$OC" \
            "original_0000|https://testnet.tonapi.io/v2/nfts/$ON0" \
            "original_0001|https://testnet.tonapi.io/v2/nfts/$ON1" \
            "probe_collection|https://testnet.tonapi.io/v2/nfts/collections/$PC" \
            "probe_0000|https://testnet.tonapi.io/v2/nfts/$PN0"
          do
            name=${spec%%|*}; url=${spec#*|}
            code=$(curl -sS -L --connect-timeout 15 --max-time 45 -w '%{http_code}' -o "build/tonapi-compare/$name.json" "$url" || true)
            echo "$code" > "build/tonapi-compare/$name.status"
            echo "$name HTTP $code"
          done

      - name: Build exact comparison
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const read=n=>JSON.parse(fs.readFileSync('build/tonapi-compare/'+n+'.json','utf8'));
          const slim=j=>({address:j.address||null,name:j.metadata?.name||null,description:j.metadata?.description||null,image:j.metadata?.image||null,animation_url:j.metadata?.animation_url||null,metadataKeys:Object.keys(j.metadata||{}).sort(),previewCount:Array.isArray(j.previews)?j.previews.length:null});
          const out={original:{collection:slim(read('original_collection')),nft0000:slim(read('original_0000')),nft0001:slim(read('original_0001'))},probe:{collection:slim(read('probe_collection')),nft0000:slim(read('probe_0000'))}};
          out.findings={originalCollectionComplete:!!(out.original.collection.name&&out.original.collection.description&&out.original.collection.image),original0000Complete:!!(out.original.nft0000.name&&out.original.nft0000.description&&out.original.nft0000.image),original0001Complete:!!(out.original.nft0001.name&&out.original.nft0001.description&&out.original.nft0001.image),probeCollectionComplete:!!(out.probe.collection.name&&out.probe.collection.description&&out.probe.collection.image),probe0000Complete:!!(out.probe.nft0000.name&&out.probe.nft0000.description&&out.probe.nft0000.image)};
          fs.writeFileSync('build/tonapi-compare/report.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: original-vs-probe-tonapi
          path: build/tonapi-compare/
          retention-days: 30
