name: Upload prereveal to Pinata

on:
  push:
    branches: [main]
    paths:
      - 'assets/coolbears-prereveal.gif'
      - '.github/workflows/pinata-prereveal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-prereveal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload official prereveal GIF to Pinata V3
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          test -n "$PINATA_JWT"
          test -f assets/coolbears-prereveal.gif
          http_code=$(curl -sS -w '%{http_code}' \
            -X POST https://uploads.pinata.cloud/v3/files \
            -H "Authorization: Bearer $PINATA_JWT" \
            -F "file=@assets/coolbears-prereveal.gif" \
            -F "network=public" \
            -F "name=CoolBears Official Pre-Reveal" \
            -o pinata-prereveal-result.json)
          cat pinata-prereveal-result.json
          test "$http_code" -ge 200 -a "$http_code" -lt 300
      - name: Save CID response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coolbears-pinata-prereveal-cid
          path: pinata-prereveal-result.json
          retention-days: 30
