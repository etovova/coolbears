name: Single unsigned checkout after daily reset
on:
  push:
    branches: ['qa/verify-saved-purchase-v41']
permissions:
  contents: read
jobs:
  checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/browser/node_modules/playwright/cli.js" install --with-deps webkit
          export COOLBEARS_PLAYWRIGHT="$RUNNER_TEMP/browser/node_modules/playwright/index.mjs"
          QA_ENGINE=webkit QA_WORKER_VERSION=8e3dc641-5a90-4c2c-b9ad-5c8974139001 node tests/single-unsigned.qa.mjs
