name: Verify clean final visual NFT 0000

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-visual-nft0-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @ton/ton@16.0.0 @ton/core@0.63.1

      - name: Verify NFT 0000 on TESTNET
        env:
          TONCENTER_ENDPOINT: https://testnet.toncenter.com/api/v2/jsonRPC
        run: |
          mkdir -p build/final-visual-nft0
          cat > check.mjs <<'NODE'
          import fs from 'node:fs';
          import {Address,Cell} from '@ton/core';
          import {TonClient} from '@ton/ton';

          const p=JSON.parse(fs.readFileSync('testnet/getgems-final-visual/deployment.json','utf8'));
          const c=Address.parse(p.collectionAddressRaw);
          const client=new TonClient({endpoint:process.env.TONCENTER_ENDPOINT});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function run(a,m,stack=[]){
            let last;
            for(let i=1;i<=10;i++){
              try{return await client.runMethod(a,m,stack)}
              catch(e){last=e;await sleep(i*1500)}
            }
            throw last;
          }

          const mint=(await run(c,'get_mint_state')).stack;
          const next=mint.readBigNumber();
          const supply=mint.readBigNumber();
          const price=mint.readBigNumber();
          const paused=mint.readBigNumber();
          if(next!==1n) throw Error('NEXT_NOT_1');
          if(paused!==1n) throw Error('MINT_NOT_PAUSED');
          if(supply!==10000n||price!==7000000000n) throw Error('MINT_STATE_MISMATCH');

          const ar=(await run(c,'get_nft_address_by_index',[{type:'int',value:0n}])).stack;
          const nft=ar.readAddress();
          const ns=await client.getContractState(nft);
          if(ns.state!=='active'||!ns.code) throw Error('NFT0_NOT_ACTIVE');
          const itemHash=Cell.fromBoc(ns.code)[0].hash().toString('hex');
          if(itemHash!==p.nftItemCodeHash) throw Error('NFT0_CODE_HASH_MISMATCH');

          const nd=(await run(nft,'get_nft_data')).stack;
          const initialized=nd.readBigNumber();
          const index=nd.readBigNumber();
          const coll=nd.readAddress();
          const owner=nd.readAddress();
          const individual=nd.readCell();
          if(initialized!==-1n||index!==0n||coll.toRawString()!==c.toRawString()) throw Error('NFT0_DATA_MISMATCH');
          if(owner.toRawString()!==p.ownerAddressRaw) throw Error('NFT0_OWNER_MISMATCH');

          const suffix=individual.beginParse().loadStringTail();
          if(suffix!=='0000.json') throw Error('NFT0_SUFFIX_MISMATCH');

          const fc=(await run(c,'get_nft_content',[{type:'int',value:0n},{type:'cell',cell:individual}])).stack.readCell().beginParse();
          if(fc.loadUint(8)!==1) throw Error('NFT0_CONTENT_TAG_MISMATCH');
          const uri=fc.loadStringTail();
          const expected=p.commonMetadataPrefix+'0000.json';
          if(uri!==expected) throw Error('NFT0_URI_MISMATCH');

          const out={
            status:'FINAL_VISUAL_NFT0_VERIFIED',
            collection:p.collectionAddressTestnetBounceable,
            nft0:nft.toString({testOnly:true,bounceable:true}),
            nextItemIndex:Number(next),
            paused:true,
            ownerVerified:true,
            metadataUri:uri,
            itemCodeHash:itemHash
          };
          fs.writeFileSync('build/final-visual-nft0/onchain.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          NODE
          node check.mjs

      - name: Reindex collection and NFT 0000 in TonAPI
        run: |
          set -euo pipefail
          COLL=$(jq -r '.collection' build/final-visual-nft0/onchain.json)
          NFT=$(jq -r '.nft0' build/final-visual-nft0/onchain.json)
          for a in "$COLL" "$NFT"; do
            code=$(curl -sS -X POST -L --connect-timeout 15 --max-time 45 -w '%{http_code}' -o /tmp/reindex.body "https://testnet.tonapi.io/v2/accounts/$a/reindex" || true)
            echo "$a HTTP $code"
            test "$code" = '200'
          done

      - name: Verify exact TonAPI metadata
        run: |
          set -euo pipefail
          COLL=$(jq -r '.collection' build/final-visual-nft0/onchain.json)
          NFT=$(jq -r '.nft0' build/final-visual-nft0/onchain.json)
          for i in {1..12}; do
            cc=$(curl -sS -L --connect-timeout 15 --max-time 45 -w '%{http_code}' -o build/final-visual-nft0/collection.json "https://testnet.tonapi.io/v2/nfts/collections/$COLL" || true)
            nc=$(curl -sS -L --connect-timeout 15 --max-time 45 -w '%{http_code}' -o build/final-visual-nft0/nft0.json "https://testnet.tonapi.io/v2/nfts/$NFT" || true)
            cname=$(jq -r '.metadata.name // empty' build/final-visual-nft0/collection.json 2>/dev/null || true)
            nname=$(jq -r '.metadata.name // empty' build/final-visual-nft0/nft0.json 2>/dev/null || true)
            attrs=$(jq '.metadata.attributes // [] | length' build/final-visual-nft0/nft0.json 2>/dev/null || echo 0)
            cimg=$(jq -r '.metadata.image // empty' build/final-visual-nft0/collection.json 2>/dev/null || true)
            ccover=$(jq -r '.metadata.cover_image // empty' build/final-visual-nft0/collection.json 2>/dev/null || true)
            echo "attempt=$i collection=$cname nft=$nname attrs=$attrs"
            if [ "$cc" = '200' ] && [ "$nc" = '200' ] && [ "$cname" = 'CoolBears' ] && [ "$nname" = 'CoolBears #0000' ] && [ "$attrs" = '7' ] && [ "$cimg" = 'https://coolbears-nfts.com/testnet/getgems-final-visual/assets/CoolBears_Getgems_Square_Logo_1000x1000.png' ] && [ "$ccover" = 'https://coolbears-nfts.com/testnet/getgems-final-visual/assets/CoolBears_Getgems_Banner_2880x680.png' ]; then
              echo FINAL_VISUAL_TONAPI_NFT0_COMPLETE=1
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Reconfirm production HOLD
        if: always()
        run: |
          test "$(jq -r '.phase' release/launch-state.json)" = 'hold'
          test "$(jq -r '.mainnetVerified' release/launch-state.json)" = 'false'
          test "$(jq -r '.publicMintApproved' release/launch-state.json)" = 'false'
          test "$(jq -r '.automaticRevealArmed' release/launch-state.json)" = 'false'
          echo PRODUCTION_HOLD_OK
