name: Build Getgems rarity TESTNET probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rarity-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build four visible NFT images and controlled metadata
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          mkdir -p testnet/rarity-probe/assets
          python3 - <<'PY'
          from PIL import Image,ImageDraw,ImageFont
          import json,collections,math,os
          base=Image.open('testnet/getgems-ab/assets/image.png').convert('RGB').resize((1000,1000))
          traits=[
            {
              "Background":"Gold","Body":"Gold","Clothes":"Gold Suit","Mouth":"Diamond Grill",
              "Eyes":"Gold Glasses","Head":"Crown","Ears":"Diamonds"
            },
            {
              "Background":"Blue","Body":"Brown","Clothes":"Hoodie","Mouth":"Smile",
              "Eyes":"Cyber Goggles","Head":"Cap","Ears":"Ring"
            },
            {
              "Background":"Blue","Body":"Light Brown","Clothes":"Leather Jacket","Mouth":"Smile",
              "Eyes":"Crystal Glasses","Head":"Cap","Ears":"Ring"
            },
            {
              "Background":"Blue","Body":"Light Brown","Clothes":"Hoodie","Mouth":"Smile",
              "Eyes":"Crystal Glasses","Head":"Cap","Ears":"Ring"
            }
          ]
          cats=["Background","Body","Clothes","Mouth","Eyes","Head","Ears"]
          for i,t in enumerate(traits):
              im=base.copy()
              d=ImageDraw.Draw(im)
              d.rectangle((0,860,1000,1000),fill=(0,0,0))
              d.text((35,885),f'RARITY PROBE #{i:04d}',fill=(255,255,255))
              im.save(f'testnet/rarity-probe/assets/{i:04d}.png',format='PNG',optimize=True)
              meta={
                "name":f"CoolBears Rarity Probe #{i:04d}",
                "description":"TESTNET-only NFT used to verify Getgems attribute percentages and rarity ranking.",
                "image":f"https://coolbears-nfts.com/testnet/rarity-probe/assets/{i:04d}.png",
                "attributes":[{"trait_type":c,"value":t[c]} for c in cats]
              }
              open(f'testnet/rarity-probe/{i:04d}.json','w').write(json.dumps(meta,ensure_ascii=False,indent=2)+'\n')
          collection={
            "name":"CoolBears Rarity Probe",
            "description":"TESTNET-only 4-NFT collection with controlled trait frequencies for verifying Getgems rarity percentages and rank.",
            "image":"https://coolbears-nfts.com/testnet/getgems-ab/assets/image.png",
            "cover_image":"https://coolbears-nfts.com/testnet/getgems-ab/assets/cover.png",
            "social_links":["https://coolbears-nfts.com/"]
          }
          open('testnet/rarity-probe/collection.json','w').write(json.dumps(collection,ensure_ascii=False,indent=2)+'\n')

          freq={c:collections.Counter(t[c] for t in traits) for c in cats}
          expected={}
          scores=[]
          for i,t in enumerate(traits):
              attrs=[]
              score=0.0
              for c in cats:
                  n=freq[c][t[c]]
                  pct=n/4*100
                  score += 1/(n/4)
                  attrs.append({"trait_type":c,"value":t[c],"count":n,"percent":pct})
              expected[f"{i:04d}"]={"attributes":attrs,"simple_inverse_frequency_score":score}
              scores.append((score,i))
          order=[i for _,i in sorted(scores,reverse=True)]
          assert order==[0,1,2,3],order
          allp=sorted({a["percent"] for e in expected.values() for a in e["attributes"]})
          assert allp==[25.0,50.0,75.0],allp
          report={
            "schema":1,
            "items":4,
            "categories":cats,
            "expectedPercentages":allp,
            "expectedRarityOrder":["0000","0001","0002","0003"],
            "metadata":expected
          }
          open('testnet/rarity-probe/expected-rarity.json','w').write(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({"percentages":allp,"order":order}))
          PY

      - name: Checkout pinned TON stdlib and install FunC compiler
        run: |
          source contracts/TON_REFERENCE.lock
          git clone --filter=blob:none "https://github.com/${source_repository}.git" /tmp/token-contract
          git -C /tmp/token-contract checkout --detach "$source_commit"
          npm install --no-save --ignore-scripts '@ton-community/func-js' '@ton/core@0.63.1'

      - name: Compile cheap four-item diagnostic contract and build StateInit
        run: |
          cat > build-rarity-probe.mjs <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {compileFunc} from '@ton-community/func-js';
          import {Cell,beginCell,loadStateInit,contractAddress,storeStateInit} from '@ton/core';

          const prod=JSON.parse(fs.readFileSync('launch/candidate.json','utf8'));
          const prodInit=loadStateInit(Cell.fromBase64(prod.stateInitBocBase64).beginParse());
          const pd=prodInit.data.beginParse();
          const owner=pd.loadAddress();
          pd.loadUintBig(64);
          pd.loadRef();
          const itemCode=pd.loadRef();
          const royalty=pd.loadRef();
          const treasury=pd.loadAddress();
          pd.loadBit();
          pd.loadBit();
          const commitment=pd.loadUintBig(256);
          if(pd.remainingBits||pd.remainingRefs) throw Error('PROD_DATA_EXTRA');

          let source=fs.readFileSync('contracts/candidate/collection.fc','utf8');
          source=source
            .replace('const int SUPPLY = 10000;','const int SUPPLY = 4;')
            .replace('const int PRICE = 7000000000;','const int PRICE = 50000000;')
            .replace('const int PAYMENT = 7100000000;','const int PAYMENT = 100000000;')
            .replace('const int KEEP_BALANCE = 200000000;','const int KEEP_BALANCE = 20000000;');
          if(!source.includes('const int SUPPLY = 4;')||!source.includes('const int PAYMENT = 100000000;')) throw Error('SOURCE_PATCH_FAILED');
          fs.writeFileSync('testnet/rarity-probe/contract.fc',source);

          const r=await compileFunc({
            targets:['rarity.fc'],
            sources:{
              'stdlib.fc':fs.readFileSync('/tmp/token-contract/stdlib.fc','utf8'),
              'rarity.fc':source
            }
          });
          if(r.status!=='ok') throw Error(r.message);
          const code=Cell.fromBase64(r.codeBoc);

          const collectionUrl='https://coolbears-nfts.com/testnet/rarity-probe/collection.json';
          const commonPrefix='https://coolbears-nfts.com/testnet/rarity-probe/';
          const content=beginCell()
            .storeRef(beginCell().storeUint(1,8).storeStringTail(collectionUrl).endCell())
            .storeRef(beginCell().storeStringTail(commonPrefix).endCell())
            .endCell();
          const data=beginCell()
            .storeAddress(owner).storeUint(0,64)
            .storeRef(content).storeRef(itemCode).storeRef(royalty)
            .storeAddress(treasury).storeBit(true).storeBit(false).storeUint(commitment,256)
            .endCell();

          const init={code,data};
          const address=contractAddress(0,init);
          const stateInitCell=beginCell().store(storeStateInit(init)).endCell();
          const deployPayload=beginCell().endCell().toBoc().toString('base64');
          const hash=f=>crypto.createHash('sha256').update(fs.readFileSync(f)).digest('hex');

          const out={
            schema:1,
            diagnosticOnly:true,
            variant:'getgems-rarity-four-item',
            network:'testnet',
            supply:4,
            priceNanoTon:50000000,
            paymentNanoTon:100000000,
            itemValueNanoTon:50000000,
            sourceCandidateRevision:prod.collectionRevision,
            ownerAddressRaw:owner.toRawString(),
            treasuryAddressRaw:treasury.toRawString(),
            collectionAddressRaw:address.toRawString(),
            collectionAddressTestnetBounceable:address.toString({testOnly:true,bounceable:true}),
            collectionAddressTestnetNonBounceable:address.toString({testOnly:true,bounceable:false}),
            collectionCodeHash:code.hash().toString('hex'),
            nftItemCodeHash:itemCode.hash().toString('hex'),
            collectionMetadataUrl:collectionUrl,
            commonMetadataPrefix:commonPrefix,
            initialPaused:true,
            nextItemIndex:0,
            stateInitBocBase64:stateInitCell.toBoc().toString('base64'),
            tonConnectDeployMessage:{
              address:address.toString({testOnly:true,bounceable:false}),
              amount:'300000000',
              stateInit:stateInitCell.toBoc().toString('base64'),
              payload:deployPayload
            },
            expectedRaritySha256:hash('testnet/rarity-probe/expected-rarity.json'),
            metadataSha256:Object.fromEntries([0,1,2,3].map(i=>[String(i).padStart(4,'0'),hash('testnet/rarity-probe/'+String(i).padStart(4,'0')+'.json')]))
          };
          fs.writeFileSync('testnet/rarity-probe/deployment.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify({address:out.collectionAddressTestnetBounceable,codeHash:out.collectionCodeHash,supply:out.supply,price:out.priceNanoTon}));
          NODE
          node build-rarity-probe.mjs

      - name: Verify generated package and metadata invariants
        run: |
          set -euo pipefail
          test "$(jq -r '.diagnosticOnly' testnet/rarity-probe/deployment.json)" = "true"
          test "$(jq -r '.network' testnet/rarity-probe/deployment.json)" = "testnet"
          test "$(jq -r '.supply' testnet/rarity-probe/deployment.json)" = "4"
          test "$(jq -r '.priceNanoTon' testnet/rarity-probe/deployment.json)" = "50000000"
          test "$(jq -r '.paymentNanoTon' testnet/rarity-probe/deployment.json)" = "100000000"
          test "$(jq -r '.expectedPercentages|join(",")' testnet/rarity-probe/expected-rarity.json)" = "25,50,75"
          test "$(jq -r '.expectedRarityOrder|join(",")' testnet/rarity-probe/expected-rarity.json)" = "0000,0001,0002,0003"
          for i in 0000 0001 0002 0003; do
            test "$(jq '.attributes|length' testnet/rarity-probe/$i.json)" = "7"
            test "$(jq -r '.attributes[].trait_type' testnet/rarity-probe/$i.json | sort | uniq | wc -l | tr -d ' ')" = "7"
          done
          python3 - <<'PY'
          from PIL import Image
          for i in range(4):
              p=f'testnet/rarity-probe/assets/{i:04d}.png'
              im=Image.open(p); im.load()
              assert im.format=='PNG' and im.size==(1000,1000)
          PY
          echo RARITY_METADATA_INVARIANTS_OK

      - name: Add rarity probe files to public allow-list
        run: |
          python3 - <<'PY'
          import json
          p='scripts/public-files.json'
          a=json.load(open(p))
          items=[
            'testnet/rarity-probe/index.html',
            'testnet/rarity-probe/probe.js',
            'testnet/rarity-probe/deployment.json',
            'testnet/rarity-probe/collection.json',
            'testnet/rarity-probe/expected-rarity.json'
          ]
          items += [f'testnet/rarity-probe/{i:04d}.json' for i in range(4)]
          items += [f'testnet/rarity-probe/assets/{i:04d}.png' for i in range(4)]
          for x in items:
              if x not in a:a.append(x)
          open(p,'w').write(json.dumps(sorted(a),indent=2)+'\n')
          PY

      - name: Verify production remains HOLD
        run: |
          test "$(jq -r '.phase' release/launch-state.json)" = "hold"
          test "$(jq -r '.mainnetVerified' release/launch-state.json)" = "false"
          test "$(jq -r '.publicMintApproved' release/launch-state.json)" = "false"
          test "$(jq -r '.automaticRevealArmed' release/launch-state.json)" = "false"
          echo PRODUCTION_HOLD_OK

      - name: Commit generated rarity probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add testnet/rarity-probe scripts/public-files.json
          if git diff --cached --quiet; then echo NO_CHANGES; exit 0; fi
          git commit -m 'Build Getgems rarity TESTNET probe'
          git push origin HEAD:main
