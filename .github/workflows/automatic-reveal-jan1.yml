name: CoolBears guarded corrected automatic reveal Jan 1 2027

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/automatic-reveal-jan1.yml'
      - 'scripts/automatic-reveal.mjs'
      - 'scripts/publish-final-car-at-reveal.mjs'
      - 'scripts/build-exact-final-car-from-recovery.py'
      - 'launch/candidate.json'
      - 'launch/package-tools.mjs'
      - 'release/launch-state.json'
  schedule:
    # GitHub Actions cron uses UTC. Retry every 5 minutes during the first hour.
    # Scripts are one-time/idempotent and fail closed unless all corrected gates pass.
    - cron: '*/5 0 1 1 *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coolbears-corrected-automatic-reveal-jan1
  cancel-in-progress: false

jobs:
  reveal:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install exact TON library
        run: npm install --no-save --ignore-scripts '@ton/core@0.63.1'

      - name: Verify exact corrected candidate and schedule authorization
        run: |
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const b=fs.readFileSync('launch/candidate.json'),p=JSON.parse(b),s=JSON.parse(fs.readFileSync('release/launch-state.json'));
          const PACKAGE='385d5550ff4cb83422e2ff052e958225aa859729f9ba7adfb0a7a04825977e2c';
          const MANIFEST='208cdabdfa3ed6f4b01d23fbcec076b22cd6da5c582c6bef9d3b7c43f9b04488';
          const CAR='9b419a1d4642fd3e3b7d7ddcb1f27db6e25532b756634165a269ae0b76b02161';
          if(crypto.createHash('sha256').update(b).digest('hex')!==PACKAGE) throw Error('CANDIDATE_SHA_MISMATCH');
          if(p.collectionRevision!=='v3-glasses-correction-1') throw Error('CANDIDATE_REVISION_MISMATCH');
          if(p.releaseManifestSha256!==MANIFEST||p.releaseCarSha256!==CAR) throw Error('CANDIDATE_RELEASE_BINDING_MISMATCH');
          if(p.revealAt!==1798761600) throw Error('REVEAL_DATE_MISMATCH');
          if(process.env.GITHUB_EVENT_NAME==='schedule'){
            const now=Math.floor(Date.now()/1000),year=new Date().getUTCFullYear();
            if(year!==2027) throw Error('SCHEDULE_NOT_2027');
            if(now<1798761600) throw Error('SCHEDULE_TOO_EARLY');
            if(s.phase!=='hold') throw Error('PRODUCTION_NOT_HELD');
            if(s.automaticRevealArmed!==true||s.privateStorageVerified!==true||s.testnetVerified!==true||s.mainnetVerified!==true||s.creatorNftVerified!==true) throw Error('REVEAL_NOT_FULLY_ARMED');
            if(s.publicMintApproved!==false) throw Error('PUBLIC_MINT_MUST_REMAIN_DISABLED');
            if(s.packageSha256!==PACKAGE) throw Error('ARMED_PACKAGE_MISMATCH');
          }
          NODE

      - name: Prepare corrected publication/reveal guards on nonscheduled runs
        if: github.event_name != 'schedule'
        run: |
          node scripts/publish-final-car-at-reveal.mjs --prepare-only
          node scripts/automatic-reveal.mjs --prepare-only

      - name: Free disk for scheduled corrected rebuild and private CAR transfer
        if: github.event_name == 'schedule'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          df -h /

      - name: Restore sealed PRIVATE source recovery
        if: github.event_name == 'schedule'
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          PINATA_GATEWAY: ${{ vars.PINATA_GATEWAY }}
        run: node scripts/restore-private-recovery.mjs

      - name: Install exact image library for corrected rebuild
        if: github.event_name == 'schedule'
        run: python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'

      - name: Rebuild exact corrected release and manifest from sealed source
        if: github.event_name == 'schedule'
        run: |
          python3 scripts/build-exact-final-car-from-recovery.py
          test "$(jq -r '.collectionRevision' build/private-final-car/build-summary.json)" = "v3-glasses-correction-1"
          test "$(jq -r '.packageSha256' build/private-final-car/build-summary.json)" = "385d5550ff4cb83422e2ff052e958225aa859729f9ba7adfb0a7a04825977e2c"
          test "$(jq -r '.manifestSha256' build/private-final-car/build-summary.json)" = "208cdabdfa3ed6f4b01d23fbcec076b22cd6da5c582c6bef9d3b7c43f9b04488"
          test "$(jq -r '.carSha256' build/private-final-car/build-summary.json)" = "9b419a1d4642fd3e3b7d7ddcb1f27db6e25532b756634165a269ae0b76b02161"
          test "$(jq -r '.correctedNfts' build/private-final-car/build-summary.json)" = "200"
          # Keep the corrected manifest for the publication/reveal gates, but remove the
          # heavy locally rebuilt image archive/CAR before reconstructing the authoritative
          # PRIVATE Pinata CAR. This avoids duplicate ~13 GB copies on the runner.
          rm -f -- "$RUNNER_TEMP/coolbears-final-car-work/CoolBears_v3_rendered_verified.zip"
          rm -f -- "$RUNNER_TEMP/coolbears-final-car-work/release/CoolBears_v3_final.car"

      - name: Publish exact corrected PRIVATE CAR and verify public bytes
        if: github.event_name == 'schedule'
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          PINATA_GATEWAY: ${{ vars.PINATA_GATEWAY }}
        run: node scripts/publish-final-car-at-reveal.mjs --publish

      - name: Broadcast reveal only after corrected public publication receipt
        if: github.event_name == 'schedule'
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
        run: node scripts/automatic-reveal.mjs --broadcast

      - name: Remove private source/rebuild/public-transfer material
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/coolbears-verified-recovery"
          rm -rf -- "$RUNNER_TEMP/coolbears-final-car-work"
          rm -f -- "$RUNNER_TEMP/CoolBears_v3_glasses_correction_1_FINAL_for_public_reveal.car"
          rm -f -- "$RUNNER_TEMP/CoolBears_v3_glasses_correction_1_FINAL_for_public_reveal.part"

      - name: Preserve nonsensitive reveal verification evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-automatic-reveal-nonsensitive-evidence
          path: |
            build/automatic-reveal/summary.json
            build/automatic-reveal/publication-summary.json
            build/private-final-car/build-summary.json
          if-no-files-found: ignore
          retention-days: 30
