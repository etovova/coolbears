name: Install high quality CoolBears promo asset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-promo-asset.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and verify promo artwork
        run: |
          set -euo pipefail
          base64 -d .asset_upload/promo01_1400_q65.b64 > assets/nft/promo-01.webp
          test "$(wc -c < assets/nft/promo-01.webp)" -eq 99392
          echo '49d23a1757adaf49aeb3abfa102469ba8c2480a7c6c863aae9655e9020d10b9d  assets/nft/promo-01.webp' | sha256sum -c -
          file assets/nft/promo-01.webp | grep -q '1400x1400'
      - name: Commit binary and remove staging file
        run: |
          set -euo pipefail
          rm .asset_upload/promo01_1400_q65.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/nft/promo-01.webp .asset_upload/promo01_1400_q65.b64
          git commit -m 'Replace promo 01 with high quality CoolBear 6870' || exit 0
          git push
