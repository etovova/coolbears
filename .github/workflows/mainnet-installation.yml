name: Closed Mainnet operational check
on:
  pull_request:
    paths: ['hosting/mainnet/**', 'scripts/verify-mainnet-installation.mjs', '.github/workflows/mainnet-installation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed-site:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: node scripts/verify-mainnet-installation.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mainnet-installation-observation
          path: build/mainnet-installation-observation.SAFE.json
          if-no-files-found: error
