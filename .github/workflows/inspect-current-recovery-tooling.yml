name: Inspect current sealed recovery tooling

on:
  push:
    paths:
      - 'scripts/inspect-current-recovery-tooling.py'
      - '.github/workflows/inspect-current-recovery-tooling.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore current sealed PRIVATE recovery
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          PINATA_GATEWAY: ${{ secrets.PINATA_GATEWAY }}
        run: node scripts/restore-private-recovery.mjs
      - name: Inspect executable tooling names only
        run: python3 scripts/inspect-current-recovery-tooling.py
      - name: Confirm production remains held
        run: node scripts/validate-release-state.mjs
      - name: Remove decrypted private recovery
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/coolbears-verified-recovery"
      - name: Preserve nonsensitive tooling summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-recovery-tooling-summary
          path: build/current-recovery-tooling/summary.json
          retention-days: 30
