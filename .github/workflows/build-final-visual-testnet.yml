name: Build clean final visual Getgems TESTNET

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-final-visual-testnet.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact approved branding and description
        run: |
          set -euo pipefail
          test "$(sha256sum testnet/getgems-final-visual/assets/CoolBears_Getgems_Square_Logo_1000x1000.png | awk '{print $1}')" = "5d8398d9497deab99a1c57d147df43047131fa9354097ea2879385f3bf6d71e7"
          test "$(sha256sum testnet/getgems-final-visual/assets/CoolBears_Getgems_Banner_2880x680.png | awk '{print $1}')" = "d3f82a120907b3ec5747628127580b9a1f80757676692361f43a533b5248bb95"
          python3 - <<'PY'
          import json
          c=json.load(open('testnet/getgems-final-visual/collection.json'))
          expected="10,000 unique CoolBears on TON. Everyone gets a bear. Not everyone gets a legend.\n\nNo real value. No financial returns. No celebrity backing. Don’t buy expecting profit. CoolBears is just for fun."
          assert c['name']=='CoolBears'
          assert c['description']==expected,(c['description'],expected)
          assert c['image'].endswith('/CoolBears_Getgems_Square_Logo_1000x1000.png')
          assert c['cover_image'].endswith('/CoolBears_Getgems_Banner_2880x680.png')
          PY
          echo EXACT_APPROVED_COLLECTION_METADATA_OK

      - name: Verify all four NFT metadata, GIF and controlled rarity
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          python3 - <<'PY'
          import json,collections
          cats=['Background','Body','Clothes','Mouth','Eyes','Head','Ears']
          metas=[]
          images=set()
          for i in range(4):
              p=f'testnet/getgems-final-visual/{i:04d}.json'
              m=json.load(open(p))
              assert m['name']==f'CoolBears #{i:04d}'
              assert len(m['attributes'])==7
              d={a['trait_type']:a['value'] for a in m['attributes']}
              assert set(d)==set(cats)
              assert m['image']==m['animation_url']
              images.add(m['image'])
              metas.append(d)
          assert len(images)==1
          rows={}
          for c in cats:
              cnt=collections.Counter(m[c] for m in metas)
              rows[c]={k:v/4*100 for k,v in cnt.items()}
          pcts=sorted({p for d in rows.values() for p in d.values()})
          assert pcts==[25.0,50.0,75.0],pcts
          def score(m):
              s=0
              for c in cats:
                  n=sum(1 for x in metas if x[c]==m[c])
                  s+=1/(n/4)
              return s
          scores=[score(m) for m in metas]
          order=sorted(range(4),key=lambda i:scores[i],reverse=True)
          assert order==[0,1,2,3],(scores,order)
          print('CONTROLLED_RARITY_OK',rows,scores,order)
          print(next(iter(images)))
          PY
          GIF=$(jq -r '.image' testnet/getgems-final-visual/0000.json)
          curl -fsSL --retry 5 --retry-delay 2 "$GIF" -o /tmp/prereveal.gif
          test "$(sha256sum /tmp/prereveal.gif | awk '{print $1}')" = "b43ab0519db076709b7697dd3c767ab7177610fb163ec25b8c08a5146ba3d312"
          python3 - <<'PY'
          from PIL import Image,ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES=False
          im=Image.open('/tmp/prereveal.gif')
          n=getattr(im,'n_frames',1); ds=[]
          for i in range(n):
              im.seek(i); ds.append(im.info.get('duration',0)); im.load()
          assert n==148
          assert sum(ds)==4950
          assert im.size==(640,640)
          assert im.info.get('loop')==0
          print('FULL_SPEED_GIF_OK frames=148 duration_ms=4950')
          PY

      - name: Build fresh StateInit using exact verified CoolBears bytecode
        run: |
          npm install --no-save --ignore-scripts '@ton/core@0.63.1'
          cat > build-final-visual.mjs <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {Cell,beginCell,loadStateInit,contractAddress,storeStateInit} from '@ton/core';

          const p=JSON.parse(fs.readFileSync('launch/candidate.json','utf8'));
          const init=loadStateInit(Cell.fromBase64(p.stateInitBocBase64).beginParse());
          if(!init.code||!init.data)throw Error('CANDIDATE_STATEINIT_INCOMPLETE');
          const codeHash=init.code.hash().toString('hex');
          if(codeHash!==p.collectionCodeHash)throw Error('SOURCE_CODE_HASH_MISMATCH');
          if(codeHash!=='4a5dcc56c96ab4bfb1815242b3e696ee1a1663c9f1254c893455d47bb746dc2b')throw Error('NOT_VERIFIED_COOLBEARS_CODE');

          const ds=init.data.beginParse();
          const owner=ds.loadAddress();
          ds.loadUintBig(64);
          ds.loadRef();
          const item=ds.loadRef();
          const royalty=ds.loadRef();
          const treasury=ds.loadAddress();
          ds.loadBit();
          ds.loadBit();
          const commitment=ds.loadUintBig(256);
          if(ds.remainingBits||ds.remainingRefs)throw Error('BASE_DATA_EXTRA');

          const collectionUrl='https://coolbears-nfts.com/testnet/getgems-final-visual/collection.json';
          const commonPrefix='https://coolbears-nfts.com/testnet/getgems-final-visual/';
          const content=beginCell()
            .storeRef(beginCell().storeUint(1,8).storeStringTail(collectionUrl).endCell())
            .storeRef(beginCell().storeStringTail(commonPrefix).endCell())
            .endCell();
          const data=beginCell()
            .storeAddress(owner).storeUint(0,64)
            .storeRef(content).storeRef(item).storeRef(royalty)
            .storeAddress(treasury).storeBit(true).storeBit(false).storeUint(commitment,256)
            .endCell();

          const fresh={code:init.code,data};
          const address=contractAddress(0,fresh);
          const stateInitCell=beginCell().store(storeStateInit(fresh)).endCell();
          const deployPayload=beginCell().endCell().toBoc().toString('base64');
          const claimPayload=beginCell().storeUint(0x52535630,32).storeUint(0,64).endCell().toBoc().toString('base64');
          const hash=f=>crypto.createHash('sha256').update(fs.readFileSync(f)).digest('hex');

          const out={
            schema:1,
            diagnosticOnly:true,
            variant:'clean-final-visual-rarity',
            network:'testnet',
            sourceCandidateRevision:p.collectionRevision,
            sourceCandidateCodeHash:p.collectionCodeHash,
            collectionAddressRaw:address.toRawString(),
            collectionAddressTestnetBounceable:address.toString({testOnly:true,bounceable:true}),
            collectionAddressTestnetNonBounceable:address.toString({testOnly:true,bounceable:false}),
            ownerAddressRaw:owner.toRawString(),
            treasuryAddressRaw:treasury.toRawString(),
            collectionCodeHash:codeHash,
            nftItemCodeHash:item.hash().toString('hex'),
            collectionMetadataUrl:collectionUrl,
            commonMetadataPrefix:commonPrefix,
            initialPaused:true,
            nextItemIndex:0,
            supply:10000,
            priceNanoTon:7000000000,
            prerevealGifSha256:'b43ab0519db076709b7697dd3c767ab7177610fb163ec25b8c08a5146ba3d312',
            prerevealGifFrames:148,
            prerevealGifDurationMs:4950,
            stateInitBocBase64:stateInitCell.toBoc().toString('base64'),
            tonConnectDeployMessage:{
              address:address.toString({testOnly:true,bounceable:false}),
              amount:'300000000',
              stateInit:stateInitCell.toBoc().toString('base64'),
              payload:deployPayload
            },
            tonConnectCreatorClaimRequest:{
              network:'-3',
              from:owner.toRawString(),
              messages:[{address:address.toString({testOnly:true,bounceable:true}),amount:'7100000000',payload:claimPayload}]
            },
            sha256:{
              collectionJson:hash('testnet/getgems-final-visual/collection.json'),
              nft0000Json:hash('testnet/getgems-final-visual/0000.json'),
              nft0001Json:hash('testnet/getgems-final-visual/0001.json'),
              nft0002Json:hash('testnet/getgems-final-visual/0002.json'),
              nft0003Json:hash('testnet/getgems-final-visual/0003.json'),
              logo:hash('testnet/getgems-final-visual/assets/CoolBears_Getgems_Square_Logo_1000x1000.png'),
              banner:hash('testnet/getgems-final-visual/assets/CoolBears_Getgems_Banner_2880x680.png')
            }
          };
          fs.writeFileSync('testnet/getgems-final-visual/deployment.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify({address:out.collectionAddressTestnetBounceable,codeHash:out.collectionCodeHash,variant:out.variant},null,2));
          NODE
          node build-final-visual.mjs

      - name: Verify production remains HOLD
        run: |
          test "$(jq -r '.phase' release/launch-state.json)" = 'hold'
          test "$(jq -r '.mainnetVerified' release/launch-state.json)" = 'false'
          test "$(jq -r '.publicMintApproved' release/launch-state.json)" = 'false'
          test "$(jq -r '.automaticRevealArmed' release/launch-state.json)" = 'false'
          echo PRODUCTION_HOLD_OK

      - name: Commit fresh TESTNET deployment package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add testnet/getgems-final-visual/deployment.json
          if git diff --cached --quiet; then echo NO_CHANGES; exit 0; fi
          git commit -m 'Build clean final visual Getgems TESTNET deployment'
          git push origin HEAD:main
