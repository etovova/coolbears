name: Remove prior CoolBears Pinata files
on:
  push:
    branches: [main]
    paths: ['scripts/pinata-delete-plan.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pinata-cleanup-fresh-20260918
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/pinata-cleanup.mjs
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinata-cleanup
          path: build/pinata-cleanup.json
          retention-days: 7
