name: Build exact current unsigned TESTNET package
on:
  push:
    branches: [main]
    paths: ['launch/**', 'scripts/build-current-testnet-package.mjs', '.github/workflows/testnet-deployment-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned offline validators
        run: npm install --no-save --ignore-scripts @ton/core@0.63.1 @ton/sandbox@0.44.0
      - name: Validate exact package and network boundaries offline
        run: |
          node scripts/validate-release-state.mjs
          node scripts/test-final-package.mjs
          node scripts/build-current-testnet-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: current-testnet-unsigned-not-deployed
          path: build/current-testnet/deployment.json
          retention-days: 30
