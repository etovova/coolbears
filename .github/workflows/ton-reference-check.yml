name: TON reference integrity check

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/ton-reference-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned TON NFT reference
        run: |
          set -euo pipefail
          source contracts/TON_REFERENCE.lock
          git clone --quiet https://github.com/${source_repository}.git /tmp/token-contract
          cd /tmp/token-contract
          git checkout --quiet ${source_commit}
          test "$(git hash-object nft/nft-collection-editable.fc)" = "${nft_collection_editable_sha}"
          test "$(git hash-object nft/nft-item.fc)" = "${nft_item_sha}"
          grep -q 'throw_unless(401, equal_slices(sender_address, owner_address));' nft/nft-collection-editable.fc
          grep -q 'if (op == 4)' nft/nft-collection-editable.fc
          grep -q 'royalty_params() method_id' nft/nft-collection-editable.fc
          grep -q 'get_nft_data() method_id' nft/nft-item.fc
          echo 'Pinned TON NFT reference integrity: OK'
