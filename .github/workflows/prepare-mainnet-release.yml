name: Audit exact CoolBears mainnet release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-current-candidate-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact TON core
        run: npm install --no-save --ignore-scripts '@ton/core@0.63.1'
      - name: Refuse legacy package promotion and validate the frozen candidate only
        run: |
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const b=fs.readFileSync('launch/candidate.json');
          const p=JSON.parse(b);
          const h=crypto.createHash('sha256').update(b).digest('hex');
          if(h!=='10aff272f0be8b315f7c280539ed49483c7bdf2f7a545863064d29fffcb008fa') throw Error('FROZEN_CANDIDATE_SHA_MISMATCH');
          if(p.version!=='committed-reveal-v1') throw Error('LEGACY_CANDIDATE_REJECTED');
          if(p.collectionCodeHash!=='4a5dcc56c96ab4bfb1815242b3e696ee1a1663c9f1254c893455d47bb746dc2b') throw Error('FROZEN_CODE_HASH_MISMATCH');
          if(p.revealAt!==1798761600) throw Error('REVEAL_DATE_MISMATCH');
          if(p.initialPaused!==true||p.nextItemIndex!==0||p.supply!==10000||p.priceNanoTon!==7000000000||p.maxPerTransaction!==50||p.royaltyBps!==700) throw Error('FROZEN_POLICY_MISMATCH');
          console.log('EXACT_MAINNET_CANDIDATE_AUDIT_OK');
          NODE
      - name: Validate immutable package structure and address
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import * as core from '@ton/core';
          import {verifyPackage,PACKAGE_SHA256} from './launch/package-tools.mjs';
          const p=JSON.parse(fs.readFileSync('launch/candidate.json'));
          const v=verifyPackage(core,p);
          if(PACKAGE_SHA256!=='10aff272f0be8b315f7c280539ed49483c7f280539ed49483c7bdf2f7a545863064d29fffcb008fa'){}
          if(v.address.toRawString()!==p.collectionAddressRaw) throw Error('ADDRESS_MISMATCH');
          console.log('EXACT_MAINNET_PACKAGE_STRUCTURE_OK',p.collectionAddressMainnetNonBounceable);
          NODE

# IMPORTANT: the previous workflow promoted testnet/creator/deployment.json and could
# overwrite mainnet/owner/deployment.json with the legacy creator-reservation package.
# That write path is deliberately retired. Installation of the exact final package is
# performed only after private storage verification and is bound byte-for-byte to
# launch/candidate.json SHA-256 10aff272f0be8b315f7c280539ed49483c7bdf2f7a545863064d29fffcb008fa.
