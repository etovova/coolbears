name: Refresh homepage promo cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-bust-promo.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add versioned promo URLs
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('https://coolbears-nfts.com/assets/nft/promo-01.webp', 'https://coolbears-nfts.com/assets/nft/promo-01.webp?v=6870hq2')
          s = s.replace('href="assets/nft/promo-01.webp"', 'href="assets/nft/promo-01.webp?v=6870hq2"')
          s = s.replace('src="assets/nft/promo-01.webp"', 'src="assets/nft/promo-01.webp?v=6870hq2"')
          p.write_text(s)
          PY
          grep -q 'promo-01.webp?v=6870hq2' index.html
      - name: Commit refresh
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refresh high quality homepage promo image'
          git push origin HEAD:main
