name: Check Getgems A/B probe indexing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/getgems-ab-indexer-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Poll TonAPI TESTNET for probe metadata
        run: |
          set -euo pipefail
          mkdir -p build/getgems-ab-index
          COLL=$(jq -r '.collectionAddressTestnetBounceable' testnet/getgems-ab/deployment.json)
          NFT='kQDrhTQDljP2dDqSqzYtL_CNIv7lW_pRfS6bQ-pIOCk804c_'
          for i in {1..12}; do
            cc=$(curl -sS -L --connect-timeout 15 --max-time 45 -w '%{http_code}' -o build/getgems-ab-index/tonapi-collection.json "https://testnet.tonapi.io/v2/nfts/collections/$COLL" || true)
            nc=$(curl -sS -L --connect-timeout 15 --max-time 45 -w '%{http_code}' -o build/getgems-ab-index/tonapi-nft0.json "https://testnet.tonapi.io/v2/nfts/$NFT" || true)
            echo "attempt=$i collection_http=$cc nft_http=$nc"
            if [ "$cc" = "200" ] && [ "$nc" = "200" ]; then
              cname=$(jq -r '.metadata.name // empty' build/getgems-ab-index/tonapi-collection.json)
              nname=$(jq -r '.metadata.name // empty' build/getgems-ab-index/tonapi-nft0.json)
              cdesc=$(jq -r '.metadata.description // empty' build/getgems-ab-index/tonapi-collection.json)
              ndesc=$(jq -r '.metadata.description // empty' build/getgems-ab-index/tonapi-nft0.json)
              cimg=$(jq -r '.metadata.image // empty' build/getgems-ab-index/tonapi-collection.json)
              nimg=$(jq -r '.metadata.image // empty' build/getgems-ab-index/tonapi-nft0.json)
              echo "TonAPI collection name=$cname nft name=$nname"
              if [ "$cname" = "CoolBears Probe" ] && [ "$nname" = "CoolBears Probe #0000" ] && [ -n "$cdesc" ] && [ -n "$ndesc" ] && [ -n "$cimg" ] && [ -n "$nimg" ]; then
                echo "TONAPI_PROBE_METADATA_COMPLETE=1"
                break
              fi
            fi
            sleep 20
          done
          test "$(jq -r '.metadata.name // empty' build/getgems-ab-index/tonapi-collection.json)" = "CoolBears Probe"
          test "$(jq -r '.metadata.name // empty' build/getgems-ab-index/tonapi-nft0.json)" = "CoolBears Probe #0000"
          jq '{address,metadata,previews,next_item_index}' build/getgems-ab-index/tonapi-collection.json > build/getgems-ab-index/tonapi-collection-summary.json
          jq '{address,index,owner,collection,metadata,previews}' build/getgems-ab-index/tonapi-nft0.json > build/getgems-ab-index/tonapi-nft0-summary.json

      - name: Query Getgems TESTNET read-only GraphQL
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p build/getgems-ab-index/getgems
          cat > /tmp/query.json <<'JSON'
          {
            "query":"query($c:String!,$n:String!){collection:nftCollectionByAddress(address:$c){address name description rawMetadata image{originalUrl} coverImage{originalUrl}} nft:alphaNftItemByAddress(address:$n){address name description rawMetadata metadataSourceType contentSourceType content{__typename ... on NftContentImage{originalUrl} ... on NftContentNotLoaded{notLoaded}} collection{address name}}}",
            "variables":{
              "c":"kQAafJOFA0VLJK5HFCIlH3cWFOYS9_Eb25J5hdcvTnSGhRSc",
              "n":"kQDrhTQDljP2dDqSqzYtL_CNIv7lW_pRfS6bQ-pIOCk804c_"
            }
          }
          JSON
          code=$(curl -sS -L --connect-timeout 15 --max-time 45 -w '%{http_code}'             -H 'content-type: application/json'             -H 'accept: application/json'             --data-binary @/tmp/query.json             -o build/getgems-ab-index/getgems/read.json             'https://api.testnet.getgems.io/graphql/' || true)
          echo "$code" > build/getgems-ab-index/getgems/status.txt
          echo "GETGEMS_READ_HTTP=$code"
          jq . build/getgems-ab-index/getgems/read.json || true

      - name: Build comparison report
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const read=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return null}};
          const tonC=read('build/getgems-ab-index/tonapi-collection.json');
          const tonN=read('build/getgems-ab-index/tonapi-nft0.json');
          const gg=read('build/getgems-ab-index/getgems/read.json');
          const code=(()=>{try{return fs.readFileSync('build/getgems-ab-index/getgems/status.txt','utf8').trim()}catch{return null}})();
          const report={
            schema:1,
            probe:'static-https-png',
            collection:'kQAafJOFA0VLJK5HFCIlH3cWFOYS9_Eb25J5hdcvTnSGhRSc',
            nft0:'kQDrhTQDljP2dDqSqzYtL_CNIv7lW_pRfS6bQ-pIOCk804c_',
            tonapi:{
              collectionName:tonC?.metadata?.name||null,
              collectionDescription:tonC?.metadata?.description||null,
              collectionImage:tonC?.metadata?.image||null,
              nftName:tonN?.metadata?.name||null,
              nftDescription:tonN?.metadata?.description||null,
              nftImage:tonN?.metadata?.image||null,
              complete:tonC?.metadata?.name==='CoolBears Probe'&&tonN?.metadata?.name==='CoolBears Probe #0000'
            },
            getgems:{http:code,response:gg},
            productionHold:true,
            transactionsSent:0
          };
          fs.writeFileSync('build/getgems-ab-index/report.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: getgems-ab-indexer-report
          path: build/getgems-ab-index/
          retention-days: 30
