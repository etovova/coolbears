name: Build Getgems static HTTPS A/B probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-getgems-ab-static.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build strict-valid static PNG media from valid prereveal GIF
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          mkdir -p testnet/getgems-ab/assets
          ROOT=$(jq -r '.preRevealMetadataRootIpfs' launch/candidate.json)
          curl -fsSL --retry 5 "https://gateway.pinata.cloud/ipfs/${ROOT#ipfs://}0000.json" -o /tmp/nft0.json
          IMG=$(jq -r '.image' /tmp/nft0.json)
          curl -fsSL --retry 5 "https://gateway.pinata.cloud/ipfs/${IMG#ipfs://}" -o /tmp/valid.gif
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('/tmp/valid.gif')
          im.seek(0)
          frame=im.convert('RGB').resize((1000,1000),Image.Resampling.LANCZOS)
          frame.save('testnet/getgems-ab/assets/image.png',format='PNG',optimize=True)
          bg=Image.new('RGB',(2880,680),(16,16,18))
          sq=frame.resize((680,680),Image.Resampling.LANCZOS)
          bg.paste(sq,((2880-680)//2,0))
          bg.save('testnet/getgems-ab/assets/cover.png',format='PNG',optimize=True)
          for p in ['testnet/getgems-ab/assets/image.png','testnet/getgems-ab/assets/cover.png']:
              x=Image.open(p); x.load()
              assert x.format=='PNG'
          PY

      - name: Write maximally simple Getgems-compatible HTTPS metadata
        run: |
          cat > testnet/getgems-ab/collection.json <<'JSON'
          {
            "name": "CoolBears Probe",
            "description": "Getgems TESTNET metadata compatibility probe using static PNG images and HTTPS metadata only.",
            "image": "https://coolbears-nfts.com/testnet/getgems-ab/assets/image.png",
            "cover_image": "https://coolbears-nfts.com/testnet/getgems-ab/assets/cover.png",
            "social_links": ["https://coolbears-nfts.com/"]
          }
          JSON
          cat > testnet/getgems-ab/0000.json <<'JSON'
          {
            "name": "CoolBears Probe #0000",
            "description": "Static HTTPS metadata compatibility probe.",
            "image": "https://coolbears-nfts.com/testnet/getgems-ab/assets/image.png",
            "attributes": [
              {"trait_type":"Status","value":"Probe"}
            ]
          }
          JSON
          jq -e '.name and .description and .image and .cover_image' testnet/getgems-ab/collection.json >/dev/null
          jq -e '.name and .description and .image and (.attributes|length==1)' testnet/getgems-ab/0000.json >/dev/null

      - name: Build diagnostic TESTNET StateInit from exact corrected bytecode
        run: |
          npm install --no-save --ignore-scripts '@ton/core@0.63.1'
          cat > build-getgems-probe.mjs <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {Cell,beginCell,loadStateInit,contractAddress,storeStateInit} from '@ton/core';

          const p=JSON.parse(fs.readFileSync('launch/candidate.json','utf8'));
          const init=loadStateInit(Cell.fromBase64(p.stateInitBocBase64).beginParse());
          const ds=init.data.beginParse();
          const owner=ds.loadAddress();
          ds.loadUintBig(64);
          ds.loadRef();
          const item=ds.loadRef();
          const royalty=ds.loadRef();
          const treasury=ds.loadAddress();
          ds.loadBit();
          ds.loadBit();
          const commitment=ds.loadUintBig(256);
          if(ds.remainingBits||ds.remainingRefs)throw Error('BASE_DATA_EXTRA');

          const collectionUrl='https://coolbears-nfts.com/testnet/getgems-ab/collection.json';
          const commonPrefix='https://coolbears-nfts.com/testnet/getgems-ab/';
          const content=beginCell()
            .storeRef(beginCell().storeUint(1,8).storeStringTail(collectionUrl).endCell())
            .storeRef(beginCell().storeStringTail(commonPrefix).endCell())
            .endCell();
          const data=beginCell()
            .storeAddress(owner)
            .storeUint(0,64)
            .storeRef(content)
            .storeRef(item)
            .storeRef(royalty)
            .storeAddress(treasury)
            .storeBit(true)
            .storeBit(false)
            .storeUint(commitment,256)
            .endCell();
          const diagnostic={code:init.code,data};
          const address=contractAddress(0,diagnostic);
          const stateInitCell=beginCell().store(storeStateInit(diagnostic)).endCell();
          const deployPayload=beginCell().endCell().toBoc().toString('base64');
          const claimPayload=beginCell().storeUint(0x52535630,32).storeUint(0,64).endCell().toBoc().toString('base64');
          const out={
            schema:1,
            diagnosticOnly:true,
            variant:'static-https',
            network:'testnet',
            collectionRevision:'getgems-ab-static-https',
            sourceCandidateRevision:p.collectionRevision,
            sourceCandidateCodeHash:p.collectionCodeHash,
            collectionAddressRaw:address.toRawString(),
            collectionAddressTestnetBounceable:address.toString({testOnly:true,bounceable:true}),
            collectionAddressTestnetNonBounceable:address.toString({testOnly:true,bounceable:false}),
            ownerAddressRaw:owner.toRawString(),
            treasuryAddressRaw:treasury.toRawString(),
            collectionCodeHash:init.code.hash().toString('hex'),
            nftItemCodeHash:item.hash().toString('hex'),
            collectionMetadataUrl:collectionUrl,
            commonMetadataPrefix:commonPrefix,
            initialPaused:true,
            nextItemIndex:0,
            supply:10000,
            priceNanoTon:7000000000,
            stateInitBocBase64:stateInitCell.toBoc().toString('base64'),
            tonConnectDeployMessage:{
              address:address.toString({testOnly:true,bounceable:false}),
              amount:'300000000',
              stateInit:stateInitCell.toBoc().toString('base64'),
              payload:deployPayload
            },
            tonConnectCreatorClaimRequest:{
              network:'-3',
              from:owner.toRawString(),
              messages:[{
                address:address.toString({testOnly:true,bounceable:true}),
                amount:'7100000000',
                payload:claimPayload
              }]
            },
            sha256:{
              image:crypto.createHash('sha256').update(fs.readFileSync('testnet/getgems-ab/assets/image.png')).digest('hex'),
              cover:crypto.createHash('sha256').update(fs.readFileSync('testnet/getgems-ab/assets/cover.png')).digest('hex'),
              collectionJson:crypto.createHash('sha256').update(fs.readFileSync('testnet/getgems-ab/collection.json')).digest('hex'),
              nft0000Json:crypto.createHash('sha256').update(fs.readFileSync('testnet/getgems-ab/0000.json')).digest('hex')
            }
          };
          fs.writeFileSync('testnet/getgems-ab/deployment.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify({address:out.collectionAddressTestnetBounceable,codeHash:out.collectionCodeHash,variant:out.variant}));
          NODE
          node build-getgems-probe.mjs

      - name: Add exact probe files to public allow-list
        run: |
          python3 - <<'PY'
          import json
          p='scripts/public-files.json'
          a=json.load(open(p))
          for x in [
            'testnet/getgems-ab/index.html',
            'testnet/getgems-ab/probe.js',
            'testnet/getgems-ab/deployment.json',
            'testnet/getgems-ab/collection.json',
            'testnet/getgems-ab/0000.json',
            'testnet/getgems-ab/assets/image.png',
            'testnet/getgems-ab/assets/cover.png',
          ]:
              if x not in a:a.append(x)
          a=sorted(a)
          open(p,'w').write(json.dumps(a,indent=2)+'\n')
          PY

      - name: Validate no MAINNET or production state changed
        run: |
          set -euo pipefail
          test "$(jq -r '.phase' release/launch-state.json)" = "hold"
          test "$(jq -r '.mainnetVerified' release/launch-state.json)" = "false"
          test "$(jq -r '.publicMintApproved' release/launch-state.json)" = "false"
          test "$(jq -r '.network' testnet/getgems-ab/deployment.json)" = "testnet"
          test "$(jq -r '.diagnosticOnly' testnet/getgems-ab/deployment.json)" = "true"
          file testnet/getgems-ab/assets/image.png
          file testnet/getgems-ab/assets/cover.png

      - name: Commit generated probe package
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add testnet/getgems-ab scripts/public-files.json
          if git diff --cached --quiet; then
            echo NO_CHANGES
            exit 0
          fi
          git commit -m 'Build static HTTPS Getgems TESTNET A/B probe'
          git push origin HEAD:main
