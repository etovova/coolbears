name: Audit public reveal date text

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm January 1 reveal date text only
        run: |
          set -euo pipefail
          ! grep -E -i 'October 7|7 октября|10 月 7 日' index.html app.js
          grep -E -i 'January 1|1 января|1 月 1 日' index.html app.js
          echo 'PUBLIC_REVEAL_DATE_TEXT_OK'

# Legacy self-modifying date replacement is deliberately retired. The authoritative
# reveal deadline is the frozen candidate value 1798761600 (2027-01-01T00:00:00Z),
# enforced by the contract and the guarded automatic reveal workflow.
