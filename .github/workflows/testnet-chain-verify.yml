name: Verify CoolBears TON testnet deployment

on:
  workflow_dispatch:
  # Run explicitly AFTER an authorized TESTNET deployment. Building a new
  # unsigned candidate does not imply that its testnet account is active.

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact corrected candidate binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum launch/candidate.json | awk '{print $1}')" = "763ad4e4c4e7c230652a5b44d18ef175d1abed4d989cef7b0d0116fb3e7a684f"
          test "$(jq -r '.collectionRevision' launch/candidate.json)" = "v3-glasses-correction-1"
          echo "CORRECTED_CANDIDATE_BINDING_OK"

      - name: Verify account is active on TON testnet
        shell: bash
        run: |
          set -euo pipefail
          ADDRESS=$(jq -r '.collectionAddressRaw' launch/candidate.json)
          echo "EXPECTED_ADDRESS=$ADDRESS"
          for i in {1..12}; do
            RESP=$(curl -fsS --retry 2 --retry-delay 2 "https://testnet.toncenter.com/api/v2/getAddressInformation?address=${ADDRESS}") || true
            echo "$RESP" > /tmp/address.json
            STATE=$(jq -r '.result.state // empty' /tmp/address.json 2>/dev/null || true)
            if [ "$STATE" = "active" ]; then
              echo "TON_TESTNET_ACCOUNT_ACTIVE=1"
              jq -r '"balance=" + (.result.balance // ""), "state=" + (.result.state // ""), "last_transaction_id.lt=" + (.result.last_transaction_id.lt // "")' /tmp/address.json
              exit 0
            fi
            echo "Attempt $i: account state=${STATE:-unknown}; waiting 10s"
            sleep 10
          done
          echo "Contract did not become active within verification window"
          cat /tmp/address.json || true
          exit 1

      - name: Verify mint state getter
        shell: bash
        run: |
          set -euo pipefail
          ADDRESS=$(jq -r '.collectionAddressRaw' launch/candidate.json)
          curl -fsS --retry 3 --retry-delay 2 -X POST \
            -H 'Content-Type: application/json' \
            -d "{\"address\":\"${ADDRESS}\",\"method\":\"get_mint_state\",\"stack\":[]}" \
            "https://testnet.toncenter.com/api/v2/runGetMethod" > /tmp/mint.json
          jq -e '.ok == true and .result.exit_code == 0' /tmp/mint.json >/dev/null
          echo "GET_MINT_STATE_STACK=$(jq -c '.result.stack' /tmp/mint.json)"
          node -e "const j=require('/tmp/mint.json');const v=j.result.stack.slice(0,4).map(x=>BigInt(x[1]));const [n,s,p,z]=v;if(n!==0n||s!==10000n||p!==7000000000n||z!==1n)throw new Error('bad mint state '+v);console.log('MINT_STATE_OK next='+n+' supply='+s+' price='+p+' paused='+z)"

      - name: Verify royalty getter
        shell: bash
        run: |
          set -euo pipefail
          ADDRESS=$(jq -r '.collectionAddressRaw' launch/candidate.json)
          curl -fsS --retry 3 --retry-delay 2 -X POST \
            -H 'Content-Type: application/json' \
            -d "{\"address\":\"${ADDRESS}\",\"method\":\"royalty_params\",\"stack\":[]}" \
            "https://testnet.toncenter.com/api/v2/runGetMethod" > /tmp/royalty.json
          jq -e '.ok == true and .result.exit_code == 0' /tmp/royalty.json >/dev/null
          echo "ROYALTY_STACK=$(jq -c '.result.stack' /tmp/royalty.json)"
          node -e "const j=require('/tmp/royalty.json');const n=BigInt(j.result.stack[0][1]);const d=BigInt(j.result.stack[1][1]);if(n!==7n||d!==100n)throw new Error('bad royalty '+n+'/'+d);console.log('ROYALTY_OK '+n+'/'+d)"

      - name: Verify collection getter responds
        shell: bash
        run: |
          set -euo pipefail
          ADDRESS=$(jq -r '.collectionAddressRaw' launch/candidate.json)
          curl -fsS --retry 3 --retry-delay 2 -X POST \
            -H 'Content-Type: application/json' \
            -d "{\"address\":\"${ADDRESS}\",\"method\":\"get_collection_data\",\"stack\":[]}" \
            "https://testnet.toncenter.com/api/v2/runGetMethod" > /tmp/collection.json
          jq -e '.ok == true and .result.exit_code == 0' /tmp/collection.json >/dev/null
          echo "COLLECTION_GETTER_OK"
          jq -c '.result.stack' /tmp/collection.json

# corrected live-chain verification trigger: v3-glasses-correction-1
