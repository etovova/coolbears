name: Inventory previous CoolBears Pinata files
on:
  push:
    branches: [main]
    paths: ['scripts/pinata-inventory.mjs', '.github/workflows/pinata-inventory.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/pinata-inventory.mjs
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinata-inventory
          path: build/pinata-inventory.json
          retention-days: 7
