name: Build prereveal metadata set

on:
  push:
    branches: [main]
    paths:
      - 'metadata/prereveal.json'
      - 'scripts/generate-prereveal-metadata.mjs'
      - '.github/workflows/prereveal-metadata-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate 10,000 pre-reveal item metadata files
        run: node scripts/generate-prereveal-metadata.mjs
      - name: Validate metadata set
        run: |
          set -euo pipefail
          test "$(find build/prereveal-metadata -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 10000
          test -f build/prereveal-metadata/0000.json
          test -f build/prereveal-metadata/0001.json
          test -f build/prereveal-metadata/4979.json
          test -f build/prereveal-metadata/9999.json
          node scripts/test-prereveal-policy.mjs
      - name: Package metadata set
        run: tar -czf coolbears-prereveal-metadata.tar.gz -C build prereveal-metadata
      - uses: actions/upload-artifact@v4
        with:
          name: coolbears-prereveal-metadata-10000
          path: coolbears-prereveal-metadata.tar.gz
          retention-days: 30
