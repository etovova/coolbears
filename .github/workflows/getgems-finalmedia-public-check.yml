name: Verify published final-media Getgems probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/getgems-finalmedia-public-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'

      - name: Verify published metadata layout
        run: |
          set -euo pipefail
          BASE='https://coolbears-nfts.com/testnet/getgems-finalmedia-ab'
          curl -fsSL --retry 5 --retry-delay 2 -D /tmp/c.headers -o /tmp/collection.json "$BASE/collection.json"
          curl -fsSL --retry 5 --retry-delay 2 -D /tmp/n.headers -o /tmp/0000.json "$BASE/0000.json"
          cmp --silent testnet/getgems-finalmedia-ab/collection.json /tmp/collection.json
          cmp --silent testnet/getgems-finalmedia-ab/0000.json /tmp/0000.json
          CIMG=$(jq -r '.image' /tmp/collection.json)
          CCOVER=$(jq -r '.cover_image' /tmp/collection.json)
          NIMG=$(jq -r '.image' /tmp/0000.json)
          test "$CIMG" != "$CCOVER"
          test "$NIMG" = 'https://gateway.pinata.cloud/ipfs/bafybeibyftszumcapsb5hf3fv7i2y46wj4ti6and7qv5mkigb6prx33bni'
          curl -fsSL --retry 5 -D /tmp/avatar.headers -o /tmp/avatar.png "$CIMG"
          curl -fsSL --retry 5 -D /tmp/cover.headers -o /tmp/cover.png "$CCOVER"
          curl -fsSL --retry 5 -D /tmp/gif.headers -o /tmp/prereveal.gif "$NIMG"
          grep -qi '^content-type: image/png' /tmp/avatar.headers
          grep -qi '^content-type: image/png' /tmp/cover.headers
          grep -qi '^content-type: image/gif' /tmp/gif.headers
          test "$(sha256sum /tmp/avatar.png | awk '{print $1}')" = "$(jq -r '.sha256.staticAvatar' testnet/getgems-finalmedia-ab/deployment.json)"
          test "$(sha256sum /tmp/cover.png | awk '{print $1}')" = "$(jq -r '.sha256.staticCover' testnet/getgems-finalmedia-ab/deployment.json)"
          test "$(sha256sum /tmp/prereveal.gif | awk '{print $1}')" = "$(jq -r '.prerevealGifSha256' testnet/getgems-finalmedia-ab/deployment.json)"

      - name: Strict-verify original GIF speed and media dimensions
        run: |
          python3 - <<'PY'
          from PIL import Image,ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES=False
          a=Image.open('/tmp/avatar.png'); a.load(); assert a.format=='PNG' and a.size==(1000,1000)
          c=Image.open('/tmp/cover.png'); c.load(); assert c.format=='PNG' and c.size==(2880,680)
          g=Image.open('/tmp/prereveal.gif')
          n=getattr(g,'n_frames',1); ds=[]
          for i in range(n):
              g.seek(i); ds.append(g.info.get('duration',0)); g.load()
          assert n==148
          assert sum(ds)==4950
          assert g.size==(640,640)
          assert g.info.get('loop')==0
          print('FINAL_MEDIA_LAYOUT_OK avatar=PNG cover=PNG gif_frames=148 gif_duration_ms=4950')
          PY

      - name: Verify final-media probe remains undeployed
        run: |
          set -euo pipefail
          A=$(jq -r '.collectionAddressRaw' testnet/getgems-finalmedia-ab/deployment.json)
          for i in {1..6}; do
            R=$(curl -fsSL --retry 2 "https://testnet.toncenter.com/api/v2/getAddressInformation?address=$A" || true)
            S=$(printf '%s' "$R" | jq -r '.result.state // empty' 2>/dev/null || true)
            if [ "$S" = 'uninitialized' ] || [ "$S" = 'nonexist' ]; then echo "FINAL_MEDIA_PROBE_UNDEPLOYED_OK state=$S"; exit 0; fi
            if [ "$S" = 'active' ] || [ "$S" = 'frozen' ]; then echo "Unexpected existing state: $S"; exit 1; fi
            sleep $((i*2))
          done
          exit 1

      - name: Reconfirm production HOLD
        run: |
          test "$(jq -r '.phase' release/launch-state.json)" = 'hold'
          test "$(jq -r '.mainnetVerified' release/launch-state.json)" = 'false'
          test "$(jq -r '.publicMintApproved' release/launch-state.json)" = 'false'
          test "$(jq -r '.automaticRevealArmed' release/launch-state.json)" = 'false'
          echo PRODUCTION_HOLD_OK
