name: Activate CoolBears mainnet site after live verification

on:
  push:
    branches: [main]
    paths:
      - 'mainnet/owner/ACTIVATE'
      - '.github/workflows/activate-mainnet-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-activate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require an approved candidate before activation checks
        run: |
          node scripts/validate-release-state.mjs
          node --input-type=module -e "import fs from 'node:fs'; const s=JSON.parse(fs.readFileSync('release/launch-state.json')); if(s.phase!=='approved')throw Error('Release is not approved');"
      - name: Install TON client
        run: npm install --no-save @ton/ton @ton/core
      - name: Verify live mainnet collection, creator NFT and metadata
        env:
          TONCENTER_ENDPOINT: https://toncenter.com/api/v2/jsonRPC
        run: |
          cat > verify-mainnet-launch.mjs <<'NODE'
          import fs from 'node:fs';
          import { Address } from '@ton/core';
          import { TonClient } from '@ton/ton';
          const d=JSON.parse(fs.readFileSync('mainnet/owner/deployment.json','utf8'));
          const client=new TonClient({endpoint:process.env.TONCENTER_ENDPOINT});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function run(a,m,stack=[]){let last;for(let i=1;i<=8;i++){try{const r=await client.runMethod(a,m,stack);await sleep(1700);return r;}catch(e){last=e;if(e?.response?.status!==429||i===8)throw e;await sleep(i*3000)}}throw last;}
          const collection=Address.parse(d.collectionAddressMainnetNonBounceable);
          const mint=await run(collection,'get_mint_state');
          const next=mint.stack.readBigNumber(), supply=mint.stack.readBigNumber(), price=mint.stack.readBigNumber(), paused=mint.stack.readBigNumber();
          console.log(`MAINNET next=${next} supply=${supply} price=${price} paused=${paused}`);
          if(next!==1n||supply!==10000n||price!==7000000000n||paused!==0n)throw Error('Mainnet launch state is not exactly next=1,supply=10000,price=7TON,open');
          const rr=await run(collection,'royalty_params');
          const factor=rr.stack.readBigNumber(),base=rr.stack.readBigNumber(),royalty=rr.stack.readAddress();
          if(factor!==7n||base!==100n||royalty.toRawString()!==d.treasuryAddressRaw)throw Error('Royalty mismatch');
          const ar=await run(collection,'get_nft_address_by_index',[{type:'int',value:0n}]);
          const nftAddr=ar.stack.readAddress();
          const nr=await run(nftAddr,'get_nft_data');
          const initialized=nr.stack.readBigNumber(),index=nr.stack.readBigNumber(),coll=nr.stack.readAddress(),owner=nr.stack.readAddress(),individual=nr.stack.readCell();
          if(initialized!==-1n||index!==0n||coll.toRawString()!==collection.toRawString()||owner.toRawString()!==d.treasuryAddressRaw)throw Error('Creator NFT #0 verification failed');
          const cr=await run(collection,'get_nft_content',[{type:'int',value:0n},{type:'cell',cell:individual}]);
          const full=cr.stack.readCell();const s=full.beginParse();if(s.loadUint(8)!==1)throw Error('Bad offchain tag');
          const prefix=s.loadBuffer(s.remainingBits/8).toString('utf8');const suffix=s.loadRef().beginParse().loadStringTail();const uri=prefix+suffix;
          if(uri!==d.preRevealMetadataRootIpfs+'0000.json')throw Error(`Unexpected NFT0 metadata URI ${uri}`);
          fs.writeFileSync('/tmp/mainnet-uri.txt',uri);
          console.log(`NFT0=${nftAddr.toString({bounceable:true,testOnly:false})}`);
          console.log(`NFT0_URI=${uri}`);
          NODE
          node verify-mainnet-launch.mjs
          URI=$(cat /tmp/mainnet-uri.txt)
          META="https://gateway.pinata.cloud/ipfs/${URI#ipfs://}"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$META" -o /tmp/mainnet-nft0.json
          jq -e '.name == "CoolBears #0000 — Hidden Bear" and (.image|startswith("ipfs://"))' /tmp/mainnet-nft0.json >/dev/null
          IMG=$(jq -r '.image' /tmp/mainnet-nft0.json)
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "https://gateway.pinata.cloud/ipfs/${IMG#ipfs://}" -o /tmp/mainnet-prereveal.bin
          file /tmp/mainnet-prereveal.bin | grep -q 'GIF image data'
          echo MAINNET_LIVE_VERIFIED=1
      - name: Activate production mint client
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('config.js')
          s=p.read_text()
          if "demoMode: true" not in s:
              raise SystemExit('Expected gated demoMode: true before activation')
          s=s.replace('demoMode: true','demoMode: false',1)
          p.write_text(s)
          q=Path('index.html')
          h=q.read_text()
          h=h.replace('config.js"></script>','config.js?v=mainnet1"></script>')
          q.write_text(h)
          PY
          node --input-type=module -e "import fs from 'node:fs'; const p='release/launch-state.json';const s=JSON.parse(fs.readFileSync(p));s.phase='live';fs.writeFileSync(p,JSON.stringify(s,null,2)+'\n');"
          node scripts/validate-release-state.mjs
          node --check config.js
          grep -q 'demoMode: false' config.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config.js index.html release/launch-state.json
          git commit -m 'Activate verified CoolBears mainnet mint'
          git push
