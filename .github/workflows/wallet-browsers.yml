name: Wallet browser compatibility
on:
  push:
    branches: [main, 'rpc-wallet-additions-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: ${{ matrix.engine }} wallet and RPC tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      COOLBEARS_ENGINE: ${{ matrix.engine }}
      COOLBEARS_MAIN_SITE_ROOT: public-site
      COOLBEARS_MAIN_BROWSER_OUTPUT: build/main-${{ matrix.engine }}
      COOLBEARS_BROWSER_OUTPUT: build/devnet-${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:devnet
      - run: npm run build:wallet
      - run: npm run build:site
      - run: node scripts/verify-static.mjs --check-committed
      - name: Install test browser
        run: |
          npm install --prefix "$RUNNER_TEMP/coolbears-browser" --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/coolbears-browser/node_modules/playwright/cli.js" install --with-deps "${{ matrix.engine }}"
          echo "COOLBEARS_PLAYWRIGHT=$RUNNER_TEMP/coolbears-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Main site and wallet picker
        run: node tests/main.browser.mjs
      - name: Devnet failures and recovery
        if: ${{ !cancelled() }}
        run: node tests/devnet-matrix.browser.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: wallet-tests-${{ matrix.engine }}
          path: |
            build/main-${{ matrix.engine }}/
            build/devnet-${{ matrix.engine }}/
          if-no-files-found: warn
