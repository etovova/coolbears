name: Installed GemWallet on XRPL Testnet
on:
  workflow_dispatch:
  push:
    branches: [xrpl/gemwallet-check]
    paths: ['xrpl/verification/gemwallet_browser.py', '.github/workflows/gemwallet-testnet.yml']
permissions:
  contents: read
concurrency: coolbears-installed-gemwallet
jobs:
  checkout:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright==1.56.0' 'xrpl-py==5.2.0'
      - run: python -m playwright install --with-deps chromium
      - name: Check published transaction gate and browser receipt recovery
        id: readiness
        run: python -u xrpl/verification/checkout_recovery.py
      - name: Verify installed GemWallet checkout
        if: ${{ steps.readiness.outputs.ready == 'true' }}
        run: xvfb-run -a python -u xrpl/verification/gemwallet_browser.py
