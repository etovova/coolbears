name: Inspect final visual TESTNET state after claim

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-visual-state-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @ton/ton@16.0.0 @ton/core@0.63.1
      - name: Inspect exact live state
        env:
          TONCENTER_ENDPOINT: https://testnet.toncenter.com/api/v2/jsonRPC
        run: |
          cat > inspect.mjs <<'NODE'
          import fs from 'node:fs';
          import {Address} from '@ton/core';
          import {TonClient} from '@ton/ton';
          const p=JSON.parse(fs.readFileSync('testnet/getgems-final-visual/deployment.json','utf8'));
          const c=Address.parse(p.collectionAddressRaw);
          const client=new TonClient({endpoint:process.env.TONCENTER_ENDPOINT});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const state=await client.getContractState(c);
          let out={address:p.collectionAddressTestnetBounceable,state:state.state,balance:state.balance?.toString()||null};
          if(state.state==='active'){
            let r;
            for(let i=1;i<=8;i++){
              try{r=await client.runMethod(c,'get_mint_state');break}catch(e){if(i===8)throw e;await sleep(i*1200)}
            }
            const next=r.stack.readBigNumber();
            const supply=r.stack.readBigNumber();
            const price=r.stack.readBigNumber();
            const paused=r.stack.readBigNumber();
            out={...out,next:Number(next),supply:Number(supply),priceNanoTon:Number(price),paused:paused===1n};
          }
          console.log(JSON.stringify(out,null,2));
          NODE
          node inspect.mjs
      - name: Reconfirm production HOLD
        run: |
          test "$(jq -r '.phase' release/launch-state.json)" = 'hold'
          test "$(jq -r '.mainnetVerified' release/launch-state.json)" = 'false'
          test "$(jq -r '.publicMintApproved' release/launch-state.json)" = 'false'
          echo PRODUCTION_HOLD_OK
