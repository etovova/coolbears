name: Assemble pinned public UnixFS reader and packer for offline verification
on:
  push:
    branches: ['qa/unixfs-rehearsal-v34']
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 77a855963dfb1ebd0d0ecf426c5ff82f32592462
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          cat > qa-public-deps.mjs <<'EOF'
          export {importer} from 'ipfs-unixfs-importer';
          export {CarWriter} from '@ipld/car/writer';
          export {CID} from 'multiformats/cid';
          export {sha256} from 'multiformats/hashes/sha2';
          export * as pb from '@ipld/dag-pb';
          EOF
          ./node_modules/.bin/esbuild qa-public-deps.mjs --bundle --platform=node --format=esm --minify --outfile=qa-deps.mjs
          gzip -nc qa-deps.mjs > qa-deps.mjs.gz
          sha256sum qa-deps.mjs.gz
      - uses: actions/upload-artifact@v4
        with:
          name: public-unixfs-dependencies
          path: qa-deps.mjs.gz
          retention-days: 1
