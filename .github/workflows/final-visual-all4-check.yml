name: Verify clean final visual all four NFTs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-visual-all4-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @ton/ton@16.0.0 @ton/core@0.63.1

      - name: Verify all four NFTs on-chain
        env:
          TONCENTER_ENDPOINT: https://testnet.toncenter.com/api/v2/jsonRPC
        run: |
          mkdir -p build/final-visual-all4
          cat > check.mjs <<'NODE'
          import fs from 'node:fs';
          import {Address,Cell} from '@ton/core';
          import {TonClient} from '@ton/ton';
          const p=JSON.parse(fs.readFileSync('testnet/getgems-final-visual/deployment.json','utf8'));
          const collection=Address.parse(p.collectionAddressRaw);
          const client=new TonClient({endpoint:process.env.TONCENTER_ENDPOINT});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function run(a,m,stack=[]){
            let last;
            for(let i=1;i<=12;i++){
              try{const r=await client.runMethod(a,m,stack);await sleep(1200);return r;}
              catch(e){last=e;if(i===12)throw e;await sleep(i*1800);}
            }
            throw last;
          }
          const st=await client.getContractState(collection);
          if(st.state!=='active'||!st.code)throw Error('COLLECTION_NOT_ACTIVE');
          const codeHash=Cell.fromBoc(st.code)[0].hash().toString('hex');
          if(codeHash!==p.collectionCodeHash)throw Error('COLLECTION_CODE_HASH_MISMATCH');
          if(codeHash!=='4a5dcc56c96ab4bfb1815242b3e696ee1a1663c9f1254c893455d47bb746dc2b')throw Error('NOT_VERIFIED_COOLBEARS_CODE');
          const mint=(await run(collection,'get_mint_state')).stack;
          const next=mint.readBigNumber();
          const supply=mint.readBigNumber();
          const price=mint.readBigNumber();
          const paused=mint.readBigNumber();
          if(next!==4n)throw Error('EXPECTED_NEXT_4_GOT_'+next);
          if(supply!==10000n||price!==7000000000n)throw Error('MINT_STATE_MISMATCH');
          const cd=(await run(collection,'get_collection_data')).stack;
          const cdNext=cd.readBigNumber();
          const content=cd.readCell();
          const owner=cd.readAddress();
          if(cdNext!==4n)throw Error('COLLECTION_NEXT_MISMATCH');
          if(owner.toRawString()!==p.ownerAddressRaw)throw Error('COLLECTION_OWNER_MISMATCH');
          const cs=content.beginParse();
          if(cs.loadUint(8)!==1)throw Error('COLLECTION_CONTENT_TAG_MISMATCH');
          const collectionUri=cs.loadStringTail();
          if(collectionUri!==p.collectionMetadataUrl)throw Error('COLLECTION_URI_MISMATCH');
          const items=[];
          for(let i=0;i<4;i++){
            const ar=(await run(collection,'get_nft_address_by_index',[{type:'int',value:BigInt(i)}])).stack;
            const a=ar.readAddress();
            const ns=await client.getContractState(a);
            if(ns.state!=='active'||!ns.code)throw Error('NFT_'+i+'_NOT_ACTIVE');
            const itemHash=Cell.fromBoc(ns.code)[0].hash().toString('hex');
            if(itemHash!==p.nftItemCodeHash)throw Error('NFT_'+i+'_CODE_HASH_MISMATCH');
            const nd=(await run(a,'get_nft_data')).stack;
            const initialized=nd.readBigNumber();
            const index=nd.readBigNumber();
            const coll=nd.readAddress();
            const nftOwner=nd.readAddress();
            const individual=nd.readCell();
            if(initialized!==-1n||index!==BigInt(i)||coll.toRawString()!==collection.toRawString())throw Error('NFT_'+i+'_DATA_MISMATCH');
            if(nftOwner.toRawString()!==p.ownerAddressRaw)throw Error('NFT_'+i+'_OWNER_MISMATCH');
            const suffix=individual.beginParse().loadStringTail();
            const expectedSuffix=String(i).padStart(4,'0')+'.json';
            if(suffix!==expectedSuffix)throw Error('NFT_'+i+'_SUFFIX_MISMATCH');
            const fc=(await run(collection,'get_nft_content',[{type:'int',value:BigInt(i)},{type:'cell',cell:individual}])).stack.readCell().beginParse();
            if(fc.loadUint(8)!==1)throw Error('NFT_'+i+'_CONTENT_TAG_MISMATCH');
            const uri=fc.loadStringTail();
            const expected=p.commonMetadataPrefix+expectedSuffix;
            if(uri!==expected)throw Error('NFT_'+i+'_URI_MISMATCH');
            items.push({index:i,addressTestnetBounceable:a.toString({testOnly:true,bounceable:true}),ownerRaw:nftOwner.toRawString(),metadataUri:uri,codeHash:itemHash});
          }
          const report={status:'FINAL_VISUAL_ALL4_ONCHAIN_VERIFIED',collection:p.collectionAddressTestnetBounceable,nextItemIndex:Number(next),supply:Number(supply),priceNanoTon:Number(price),paused:paused===1n,collectionUri,items};
          fs.writeFileSync('build/final-visual-all4/onchain.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          NODE
          node check.mjs

      - name: Reindex collection and all four NFTs in TonAPI
        run: |
          set -euo pipefail
          COLL=$(jq -r '.collection' build/final-visual-all4/onchain.json)
          accounts=("$COLL")
          for idx in 0 1 2 3; do
            accounts+=("$(jq -r ".items[$idx].addressTestnetBounceable" build/final-visual-all4/onchain.json)")
          done
          n=0
          for a in "${accounts[@]}"; do
            code=$(curl -sS -X POST -L --connect-timeout 15 --max-time 45 -w '%{http_code}' -o "/tmp/reindex-$n.body" "https://testnet.tonapi.io/v2/accounts/$a/reindex" || true)
            echo "REINDEX $a HTTP $code"
            test "$code" = '200'
            n=$((n+1))
          done

      - name: Poll TonAPI until exact metadata are ready
        run: |
          set -euo pipefail
          mkdir -p build/final-visual-all4/tonapi
          COLL=$(jq -r '.collection' build/final-visual-all4/onchain.json)
          for attempt in {1..16}; do
            cc=$(curl -sS -L --connect-timeout 15 --max-time 45 -w '%{http_code}' -o build/final-visual-all4/tonapi/collection.json "https://testnet.tonapi.io/v2/nfts/collections/$COLL" || true)
            ok=1
            cname=$(jq -r '.metadata.name // empty' build/final-visual-all4/tonapi/collection.json 2>/dev/null || true)
            cdesc=$(jq -r '.metadata.description // empty' build/final-visual-all4/tonapi/collection.json 2>/dev/null || true)
            cimg=$(jq -r '.metadata.image // empty' build/final-visual-all4/tonapi/collection.json 2>/dev/null || true)
            ccover=$(jq -r '.metadata.cover_image // empty' build/final-visual-all4/tonapi/collection.json 2>/dev/null || true)
            echo "attempt=$attempt collection_http=$cc name=$cname"
            if [ "$cc" != '200' ] || [ "$cname" != 'CoolBears' ] || [ -z "$cdesc" ] || [ "$cimg" != 'https://coolbears-nfts.com/testnet/getgems-final-visual/assets/CoolBears_Getgems_Square_Logo_1000x1000.png' ] || [ "$ccover" != 'https://coolbears-nfts.com/testnet/getgems-final-visual/assets/CoolBears_Getgems_Banner_2880x680.png' ]; then ok=0; fi
            for idx in 0 1 2 3; do
              A=$(jq -r ".items[$idx].addressTestnetBounceable" build/final-visual-all4/onchain.json)
              nc=$(curl -sS -L --connect-timeout 15 --max-time 45 -w '%{http_code}' -o "build/final-visual-all4/tonapi/nft${idx}.json" "https://testnet.tonapi.io/v2/nfts/$A" || true)
              name=$(jq -r '.metadata.name // empty' "build/final-visual-all4/tonapi/nft${idx}.json" 2>/dev/null || true)
              attrs=$(jq '.metadata.attributes // [] | length' "build/final-visual-all4/tonapi/nft${idx}.json" 2>/dev/null || echo 0)
              img=$(jq -r '.metadata.image // empty' "build/final-visual-all4/tonapi/nft${idx}.json" 2>/dev/null || true)
              anim=$(jq -r '.metadata.animation_url // empty' "build/final-visual-all4/tonapi/nft${idx}.json" 2>/dev/null || true)
              expected=$(printf 'CoolBears #%04d' "$idx")
              echo "  nft$idx http=$nc name=$name attrs=$attrs"
              if [ "$nc" != '200' ] || [ "$name" != "$expected" ] || [ "$attrs" != '7' ] || [ -z "$img" ] || [ "$img" != "$anim" ]; then ok=0; fi
            done
            if [ "$ok" = '1' ]; then echo FINAL_VISUAL_ALL4_TONAPI_COMPLETE=1; exit 0; fi
            sleep 15
          done
          echo FINAL_VISUAL_ALL4_TONAPI_INCOMPLETE
          exit 1

      - name: Reconfirm production HOLD
        if: always()
        run: |
          test "$(jq -r '.phase' release/launch-state.json)" = 'hold'
          test "$(jq -r '.mainnetVerified' release/launch-state.json)" = 'false'
          test "$(jq -r '.publicMintApproved' release/launch-state.json)" = 'false'
          test "$(jq -r '.automaticRevealArmed' release/launch-state.json)" = 'false'
          echo PRODUCTION_HOLD_OK
