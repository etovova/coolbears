name: Diagnose private v3 layer selection
on:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose-private-layer-selection.py'
      - '.github/workflows/private-layer-selection-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore sealed PRIVATE recovery
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          PINATA_GATEWAY: ${{ vars.PINATA_GATEWAY }}
        run: node scripts/restore-private-recovery.mjs
      - name: Diagnose layer selection without exposing private traits
        run: python3 scripts/diagnose-private-layer-selection.py
      - name: Confirm launch remains blocked
        run: node scripts/validate-release-state.mjs
      - name: Remove decrypted private material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/coolbears-verified-recovery"
      - name: Preserve nonsensitive diagnostic only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-layer-selection-diagnostic
          path: build/private-layer-selection-diagnostic/
          retention-days: 30
