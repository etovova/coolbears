name: Inspect private final CAR locator read only

on:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect-private-final-car-list.mjs'
      - '.github/workflows/inspect-private-final-car-list.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe private Pinata listing without exposing identifiers
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: node scripts/inspect-private-final-car-list.mjs
      - name: Preserve nonsensitive locator probe only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-final-car-locator-probe
          path: build/private-final-car-locator/summary.json
          retention-days: 7
