name: Remove URL hash after section navigation

on:
  push:
    paths:
      - '.site_tasks/remove-url-hash'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.js
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          marker='// clean-section-hash'
          if marker not in s:
              insert=r'''

  // clean-section-hash
  document.addEventListener('click', (event) => {
    const link = event.target.closest('a[href^="#"]');
    if (!link) return;
    const hash = link.getAttribute('href');
    if (!hash || hash === '#') return;
    const target = document.querySelector(hash);
    if (!target) return;
    event.preventDefault();
    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    history.replaceState(null, '', location.pathname + location.search);
  });

  if (location.hash) {
    requestAnimationFrame(() => {
      history.replaceState(null, '', location.pathname + location.search);
    });
  }
'''
              idx=s.rfind('})();')
              if idx == -1:
                  raise SystemExit('app.js wrapper end not found')
              s=s[:idx]+insert+s[idx:]
              p.write_text(s)

          i=Path('index.html')
          html=i.read_text()
          html=html.replace('app.js?v=5','app.js?v=6')
          i.write_text(html)
          PY
          rm -f .site_tasks/remove-url-hash
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html .site_tasks/remove-url-hash || true
          git commit -m 'Clean section hashes from browser URL' || exit 0
          git push
