name: WalletConnect purchase on XRPL Testnet
on:
  workflow_dispatch:
  push:
    branches: [xrpl/walletconnect-testnet-check]
    paths:
      - xrpl/verification/walletconnect_checkout.py
      - .github/workflows/walletconnect-testnet.yml
permissions:
  contents: read
concurrency: coolbears-walletconnect-testnet
jobs:
  checkout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright==1.56.0' 'xrpl-py==5.2.0'
      - run: python -m playwright install --with-deps chromium
      - run: python -u xrpl/verification/walletconnect_checkout.py
