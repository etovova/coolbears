name: WalletConnect purchase on XRPL Testnet
on:
  workflow_dispatch:
    inputs:
      new_purchase:
        description: Make a fresh 10 test XRP purchase
        type: boolean
        default: false
      resale:
        description: Verify royalties with a fresh Testnet purchase and resale
        type: boolean
        default: false
  push:
    branches: [xrpl/walletconnect-testnet-check, xrpl/royalty-testnet-check]
    paths:
      - xrpl/verification/testnet_resale.py
      - xrpl/verification/walletconnect_checkout.py
      - .github/workflows/walletconnect-testnet.yml
permissions:
  contents: read
concurrency: coolbears-walletconnect-testnet
jobs:
  checkout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright==1.56.0' 'xrpl-py==5.2.0'
      - run: python -m playwright install --with-deps chromium
      - name: Verify published checkout
        if: ${{ github.ref_name != 'xrpl/royalty-testnet-check' && !inputs.resale && (inputs.new_purchase || hashFiles('xrpl/verification/walletconnect-testnet-sale.json') == '') }}
        run: python -u xrpl/verification/walletconnect_checkout.py
      - name: Reopen the saved receipt and verify settlement
        if: ${{ github.ref_name != 'xrpl/royalty-testnet-check' && !inputs.resale && !inputs.new_purchase && hashFiles('xrpl/verification/walletconnect-testnet-sale.json') != '' }}
        run: python -u xrpl/verification/walletconnect_checkout.py --receipt xrpl/verification/walletconnect-testnet-sale.json
      - name: Verify primary sale and secondary royalties
        if: ${{ inputs.resale || (github.event_name == 'push' && github.ref_name == 'xrpl/royalty-testnet-check') }}
        run: python -u xrpl/verification/testnet_resale.py
