name = "coolbears-branding"
main = "worker.mjs"
compatibility_date = "2025-10-01"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "coolbears-nfts.com/xrpl/site.css*", zone_name = "coolbears-nfts.com" },
  { pattern = "coolbears-nfts.com/xrpl/brand-logo.png*", zone_name = "coolbears-nfts.com" },
  { pattern = "coolbears-nfts.com/previous-logo", zone_name = "coolbears-nfts.com" },
]

[[services]]
binding = "STOREFRONT"
service = "coolbears-xrpl"

[[rules]]
type = "Text"
globs = ["**/*.css"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true
