<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0d0d0f"><title>CoolBears — Testnet Status</title><style>*{box-sizing:border-box}body{margin:0;background:#0d0d0f;color:#fff;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:820px;margin:auto;padding:24px 18px 50px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.back{color:#9fd3ff;text-decoration:none}.tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#999}h1{font-size:clamp(34px,8vw,58px);line-height:1;margin:22px 0 10px}.muted{color:#aaa}.box{background:#151518;border:1px solid #2b2b30;border-radius:18px;padding:18px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;border-top:1px solid #29292e;padding:13px 0}.row:first-child{border-top:0;padding-top:0}.name{font-weight:700}.ok{color:#72df8b}.bad{color:#ff7675}.warn{color:#f6c85f}.small{font-size:13px;color:#999;word-break:break-all}button{width:100%;padding:14px 18px;border:0;border-radius:14px;font-weight:800;font-size:16px;cursor:pointer;margin-top:8px}code{word-break:break-all}</style></head><body><main class="wrap"><div class="top"><a class="back" href="../">← Testnet</a><span class="tag">CoolBears / Status</span></div><h1>System check</h1><p class="muted">Только чтение. Эта страница ничего не отправляет в блокчейн и не меняет контракт.</p><div class="box" id="checks"></div><div class="box"><b>Live contract</b><p id="chain" class="muted">Проверяю TON testnet…</p><p class="small">Collection: <code id="collection">—</code></p></div><button id="again">ПРОВЕРИТЬ ЕЩЁ РАЗ</button></main><script>const $=id=>document.getElementById(id);const base='../';const checks=[['deployment.json',base+'deployment.json','json'],['metadata #0000',base+'reveal/0000.json','json'],['TON Connect manifest','../../tonconnect-manifest.json','json'],['terms','../../terms.html','text'],['privacy','../../privacy.html','text']];async function one(name,url,type){const row=document.createElement('div');row.className='row';row.innerHTML='<div><div class="name"></div><div class="small"></div></div><div class="state muted">…</div>';row.querySelector('.name').textContent=name;row.querySelector('.small').textContent=url;$('checks').appendChild(row);try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);if(type==='json')await r.json();row.querySelector('.state').textContent='OK';row.querySelector('.state').className='state ok';return true}catch(e){row.querySelector('.state').textContent='FAIL';row.querySelector('.state').className='state bad';row.querySelector('.small').textContent=url+' · '+(e?.message||e);return false}}async function run(){ $('checks').innerHTML='';$('chain').textContent='Проверяю TON testnet…';$('chain').className='muted';let d=null;for(const c of checks)await one(...c);try{const r=await fetch(base+'deployment.json',{cache:'no-store'});d=await r.json();$('collection').textContent=d.collectionAddressTestnetNonBounceable;const a=d.collectionAddressTestnetNonBounceable;const q=await fetch('https://testnet.toncenter.com/api/v2/runGetMethod',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address:a,method:'get_mint_state',stack:[]})});const j=await q.json();if(!j.ok)throw new Error('getter failed');const v=j.result.stack.slice(0,4).map(x=>BigInt(x[1]));$('chain').textContent=`LIVE · minted ${v[0]}/${v[1]} · price ${Number(v[2])/1e9} TON · ${v[3]===1n?'PAUSED':'OPEN'}`;$('chain').className=v[3]===1n?'warn':'ok'}catch(e){$('chain').textContent='Live getter недоступен: '+(e?.message||e);$('chain').className='bad'}}$('again').onclick=run;run();</script></body></html>
