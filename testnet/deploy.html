<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CoolBears Testnet Deploy</title><style>body{font-family:system-ui;background:#111;color:#fff;max-width:760px;margin:40px auto;padding:20px}button{padding:14px 20px;font-weight:700}code{word-break:break-all}#deploy{display:none}.ok{color:#78e08f}.bad{color:#ff7675}</style></head>
<body><h1>CoolBears — TON Testnet Deploy</h1><p>This page can only prepare and request the already-built unsigned deployment transaction. It does not contain a seed phrase or private key.</p><div id="ton-connect"></div><p id="status">Connect the intended owner wallet on TON testnet.</p><p>Expected owner: <code id="owner"></code></p><p>Collection: <code id="collection"></code></p><button id="deploy" disabled>DEPLOY PAUSED TESTNET CONTRACT</button>
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script><script>
(async()=>{const d=await fetch('./deployment.json',{cache:'no-store'}).then(r=>r.json());owner.textContent=d.ownerAddressTestnetFriendly;collection.textContent=d.collectionAddressTestnetNonBounceable;const ui=new TON_CONNECT_UI.TonConnectUI({manifestUrl:'https://coolbears-nfts.com/tonconnect-manifest.json',buttonRootId:'ton-connect'});const status=document.getElementById('status'),btn=document.getElementById('deploy');ui.onStatusChange(w=>{btn.style.display='none';btn.disabled=true;if(!w){status.textContent='Connect the intended owner wallet on TON testnet.';status.className='';return;}const raw=w.account.address.toLowerCase();const expected=d.ownerAddressRaw.toLowerCase();if(w.account.chain!=='-3'){status.textContent='Wrong network. Switch the wallet to TON testnet.';status.className='bad';return;}if(raw!==expected){status.textContent='Connected wallet is not the configured CoolBears owner. Deployment blocked.';status.className='bad';return;}status.textContent='Owner and TON testnet verified. Deployment is still PAUSED after creation.';status.className='ok';btn.style.display='inline-block';btn.disabled=false;});btn.onclick=async()=>{btn.disabled=true;try{const m=d.tonConnectDeployMessage;await ui.sendTransaction({validUntil:Math.floor(Date.now()/1000)+600,network:'-3',messages:[m]});status.textContent='Deployment transaction submitted. Wait for testnet confirmation before any unpause.';status.className='ok';}catch(e){status.textContent='Deployment not submitted: '+(e?.message||e);status.className='bad';btn.disabled=false;}};})();
</script></body></html>
